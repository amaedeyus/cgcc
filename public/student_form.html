<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form Response</title>
    <link rel="stylesheet" href="css/student-form.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title" id="formTitle">Loading Form...</h1>
            <p class="form-description" id="formDescription"></p>
        </div>  
        
        <!-- Form sections container -->
        <div id="formSections"></div>
        
        <!-- Section error message -->
        <div id="sectionError" class="section-error"></div>

        <!-- Progress bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">Section 1 of 5</div>
        </div>
        
        <!-- Navigation buttons -->
        <div class="navigation-buttons">
            <button id="prevSectionBtn" class="nav-btn prev-btn" disabled>Previous</button>
            <button id="nextSectionBtn" class="nav-btn next-btn">Next</button>
        </div>

        <!-- Action buttons (shown only on last section) -->
        <div class="action-buttons" id="formActions" style="display: none;">
            <button id="saveDraftBtn" class="save-btn">Save Draft</button>
            <button id="submitFormBtn" class="submit-btn">Submit Form</button>
        </div>

        <div id="autosaveStatus" class="autosave-status"></div>
    </div>

    <script>
        // Global variables
        let formData = null;
        let formId = null;
        let savedResponse = null;
        let autosaveInterval = null;
        let autosaveTimeout = null;
        let hasChanges = false;
        let currentPageIndex = 0;
        let pageElements = [];
        
        // DOM elements
        const formTitleEl = document.getElementById('formTitle');
        const formDescriptionEl = document.getElementById('formDescription');
        const formSectionsEl = document.getElementById('formSections');
        const saveDraftBtn = document.getElementById('saveDraftBtn');
        const submitFormBtn = document.getElementById('submitFormBtn');
        const autosaveStatusEl = document.getElementById('autosaveStatus');
        const prevSectionBtn = document.getElementById('prevSectionBtn');
        const nextSectionBtn = document.getElementById('nextSectionBtn');
        const formActionsEl = document.getElementById('formActions');
        const progressBarEl = document.getElementById('progressBar');
        const progressTextEl = document.getElementById('progressText');
        const progressContainerEl = document.getElementById('progressContainer');
        const sectionErrorEl = document.getElementById('sectionError');
        
        // Initialize the form
        document.addEventListener('DOMContentLoaded', async function() {
            // Get form ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            formId = urlParams.get('id');
            
            if (!formId) {
                alert('No form ID specified in URL');
                return;
            }
            
            try {
                // Load form structure
                await loadFormData();
                
                // Load any saved response
                await loadSavedResponse();
                
                // Render the form
                renderForm();
                
                // Set up change detection
                setupChangeDetection();
                
                // Start autosave timer (every 30 seconds as fallback)
                autosaveInterval = setInterval(() => {
                    if (hasChanges) {
                        saveDraft();
                    }
                }, 30000);
                
                // Initialize section navigation
                updateSectionNavigation();
                
            } catch (error) {
                console.error('Error initializing form:', error);
                alert('Failed to load form. Please try again.');
            }
        });
        
        // Set up event listeners to detect form changes
        function setupChangeDetection() {
            // Listen for all input changes
            formSectionsEl.addEventListener('change', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                    triggerAutosave();
                    validateCurrentSection();
                }
            });
            
            // Listen for text input (for textareas and text inputs)
            formSectionsEl.addEventListener('input', function(e) {
                if (e.target.tagName === 'TEXTAREA' || 
                    (e.target.tagName === 'INPUT' && (e.target.type === 'text' || e.target.type === 'number' || e.target.type === 'email' || e.target.type === 'tel'))) {
                    triggerAutosave();
                    validateCurrentSection();
                }
            });
        }
        
        // Trigger autosave with debounce
        function triggerAutosave() {
            hasChanges = true;
            
            // Clear any pending timeout
            if (autosaveTimeout) {
                clearTimeout(autosaveTimeout);
            }
            
            // Set new timeout (debounce 1.5 seconds)
            autosaveTimeout = setTimeout(() => {
                if (hasChanges) {
                    saveDraft();
                }
            }, 1500);
        }
        
        // Load form structure from server
        async function loadFormData() {
            const response = await fetch(`../backend/forms/get_form_student.php?id=${formId}`);
            if (!response.ok) {
                throw new Error('Failed to load form data');
            }
            formData = await response.json();
            
            // Update header
            formTitleEl.textContent = formData.form_name;
            formDescriptionEl.textContent = formData.description || '';
        }
        
        // Load saved response if exists
        async function loadSavedResponse() {
            try {
                const response = await fetch(`../backend/forms/get_saved_response.php?formId=${formId}`);
                if (!response.ok) {
                    throw new Error('Failed to check for saved response');
                }
                savedResponse = await response.json();
            } catch (error) {
                console.error('Error loading saved response:', error);
            }
        }
        
        // Render the form sections and questions grouped by pages
        function renderForm() {
            formSectionsEl.innerHTML = '';
            pageElements = [];
            
            if (!formData || !formData.sections) {
                formSectionsEl.innerHTML = '<p>No form sections found.</p>';
                return;
            }
            
            // Sort sections by order
            const sortedSections = [...formData.sections].sort((a, b) => a.order - b.order);
            
            // Group sections into pages based on behavior
            let currentPage = null;
            let pageSections = [];
            
            sortedSections.forEach((section, index) => {
                // Default to 'next-page' if behavior is not specified
                const behavior = section.behavior || 'next-page';
                
                if (behavior === 'next-page' || currentPage === null) {
                    // Start a new page
                    if (currentPage !== null) {
                        pageElements.push(createPageElement(pageSections));
                    }
                    
                    currentPage = {
                        behavior: behavior,
                        sections: []
                    };
                    pageSections = [];
                }
                
                currentPage.sections.push(section);
                pageSections.push(section);
            });
            
            // Add the last page
            if (currentPage !== null && pageSections.length > 0) {
                pageElements.push(createPageElement(pageSections));
            }
            
            // Show the first page
            if (pageElements.length > 0) {
                pageElements[0].style.display = 'block';
            }
            
            // Apply saved responses if they exist
            if (savedResponse) {
                applySavedResponses();
            }
            
            // Update progress bar
            updateProgressBar();
            
            // Validate initial section
            validateCurrentSection();
        }
        
        // Create a page element containing one or more sections
        function createPageElement(sections) {
            const pageEl = document.createElement('div');
            pageEl.className = 'form-page';
            pageEl.style.display = 'none';
            
            sections.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section';
                sectionEl.dataset.sectionId = section.id;
                
                // Section header
                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'section-header';
                
                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'section-title';
                sectionTitle.textContent = section.title;
                
                const sectionDesc = document.createElement('p');
                sectionDesc.className = 'section-description';
                sectionDesc.textContent = section.description || '';
                
                sectionHeader.appendChild(sectionTitle);
                sectionHeader.appendChild(sectionDesc);
                sectionEl.appendChild(sectionHeader);
                
                // Questions
                if (section.questions && section.questions.length > 0) {
                    section.questions.forEach(question => {
                        sectionEl.appendChild(createQuestionElement(question));
                    });
                } else {
                    const noQuestions = document.createElement('p');
                    sectionEl.appendChild(noQuestions);
                }
                
                pageEl.appendChild(sectionEl);
            });
            
            formSectionsEl.appendChild(pageEl);
            return pageEl;
        }
        
        // Update progress bar
        function updateProgressBar() {
            if (!formData || !formData.sections || pageElements.length <= 1) {
                progressContainerEl.style.display = 'none';
                return;
            }
            
            progressContainerEl.style.display = 'block';
            const totalPages = pageElements.length;
            const progress = ((currentPageIndex + 1) / totalPages) * 100;
            
            progressBarEl.style.width = `${progress}%`;
            progressTextEl.textContent = `Section ${currentPageIndex + 1} of ${totalPages}`;
        }
        
        // Update section navigation buttons
        function updateSectionNavigation() {
            if (!formData || !formData.sections) return;
            
            const totalPages = pageElements.length;
            
            // Previous button
            prevSectionBtn.disabled = currentPageIndex === 0;
            
            // Next button
            if (currentPageIndex === totalPages - 1) {
                nextSectionBtn.style.display = 'none';
                formActionsEl.style.display = 'flex';
            } else {
                nextSectionBtn.style.display = 'inline-block';
                formActionsEl.style.display = 'none';
            }
        }
        
        // Navigate to page
        function navigateToPage(index) {
            if (index < 0 || index >= pageElements.length) return;
            
            // Hide current page
            pageElements[currentPageIndex].style.display = 'none';
            
            // Show new page
            currentPageIndex = index;
            pageElements[currentPageIndex].style.display = 'block';
            
            // Update navigation
            updateSectionNavigation();
            updateProgressBar();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Validate the new section
            validateCurrentSection();
        }
        
        // Validate the current section and return first unanswered required question
        function validateCurrentSection() {
            if (!formData || !formData.sections || currentPageIndex >= pageElements.length) return null;
            
            let firstUnansweredQuestion = null;
            const currentPage = pageElements[currentPageIndex];
            const sectionsInPage = currentPage.querySelectorAll('.section');
            
            // Clear previous error messages in this section
            currentPage.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            
            // Hide section error message
            sectionErrorEl.classList.remove('show');
            sectionErrorEl.textContent = '';
            
            // Check all required questions in current page sections
            sectionsInPage.forEach(sectionEl => {
                const sectionId = sectionEl.dataset.sectionId;
                const section = formData.sections.find(s => s.id == sectionId);
                
                if (!section || !section.questions) return;
                
                section.questions.forEach(question => {
                    if (question.type === 'display') return;
                    if (question.required) {
                        const questionEl = sectionEl.querySelector(`[data-question-id="${question.id}"]`);
                        const errorEl = questionEl.querySelector('.error-message');
                        
                        let isAnswered = false;
                        let isValid = true;
                        let validationMessage = '';
                        
                        switch (question.type) {
                            case 'multiple':
                                const checkedRadio = questionEl.querySelector(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedRadio !== null;
                                break;
                            case 'checkbox':
                                const checkedCheckboxes = questionEl.querySelectorAll(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedCheckboxes.length > 0;
                                break;
                            case 'short':
                                const textInput = questionEl.querySelector(`input[name="${question.id}"]`);
                                if (textInput) {
                                    isAnswered = textInput.value.trim() !== '';
                                    
                                    // Validate subtype if exists
                                    if (isAnswered && question.subtype) {
                                        [isValid, validationMessage] = validateSubtype(textInput.value.trim(), question.subtype);
                                    }
                                }
                                break;
                            case 'paragraph':
                                const textareaInput = questionEl.querySelector(`textarea[name="${question.id}"]`);
                                isAnswered = textareaInput && textareaInput.value.trim() !== '';
                                break;
                            case 'dropdown':
                                const selectInput = questionEl.querySelector(`select[name="${question.id}"]`);
                                isAnswered = selectInput && selectInput.value !== '';
                                break;
                            case 'date':
                                const dateInput = questionEl.querySelector(`input[type="date"][name="${question.id}"]`);
                                isAnswered = dateInput && dateInput.value !== '';
                                break;
                            case 'grid':
                                // For grids, we need at least one radio selected per row
                                const gridRows = question.rows.length;
                                let answeredRows = 0;
                                
                                for (let i = 0; i < gridRows; i++) {
                                    if (document.querySelector(`input[name="${question.id}_${i}"]:checked`)) {
                                        answeredRows++;
                                    }
                                }
                                
                                isAnswered = answeredRows === gridRows;
                                break;
                        }
                        
                        if (!isAnswered) {
                            errorEl.textContent = 'This question is required';
                            errorEl.classList.add('show');
                            
                            // Track first unanswered question
                            if (!firstUnansweredQuestion) {
                                firstUnansweredQuestion = questionEl;
                            }
                        } else if (!isValid) {
                            errorEl.textContent = validationMessage;
                            errorEl.classList.add('show');
                            
                            if (!firstUnansweredQuestion) {
                                firstUnansweredQuestion = questionEl;
                            }
                        }
                    }
                });
            });
            
            return firstUnansweredQuestion;
        }
        
        // Validate input based on subtype
        function validateSubtype(value, subtype) {
            switch (subtype) {
                case 'number':
                    if (isNaN(value)) {
                        return [false, 'Please enter a valid number'];
                    }
                    break;
                case 'email':
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(value)) {
                        return [false, 'Please enter a valid email address'];
                    }
                    break;
                case 'phone':
                    const phoneRegex = /^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$/;
                    if (!phoneRegex.test(value)) {
                        return [false, 'Please enter a valid phone number'];
                    }
                    break;
            }
            return [true, ''];
        }
        
        // Attempt to navigate to next section with validation
        function attemptNextSection() {
            const firstUnanswered = validateCurrentSection();
            
            if (firstUnanswered) {
                // Show section error message
                sectionErrorEl.textContent = 'Please complete all required questions before proceeding';
                sectionErrorEl.classList.add('show');
                
                // Scroll to first unanswered question
                firstUnanswered.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                // Proceed to next section
                navigateToPage(currentPageIndex + 1);
            }
        }
        
        // Create a question element based on its type
        function createQuestionElement(question) {
            const questionEl = document.createElement('div');
            questionEl.className = 'question';
            questionEl.dataset.questionId = question.id;
            questionEl.dataset.questionType = question.type;
            questionEl.dataset.subtype = question.subtype || '';

            // Question text
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = question.question;

            if (question.required) {
                const requiredStar = document.createElement('span');
                requiredStar.className = 'required-star';
                requiredStar.textContent = ' *';
                questionText.appendChild(requiredStar);
            }

            questionEl.appendChild(questionText);

            // Error message placeholder
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message';
            questionEl.appendChild(errorEl);

            // Create input based on question type
            switch (question.type) {
                case 'multiple': // radio buttons
                    createRadioInput(questionEl, question);
                    break;
                case 'checkbox':
                    createCheckboxInput(questionEl, question);
                    break;
                case 'short': // text input
                    createTextInput(questionEl, question);
                    break;
                case 'paragraph': // textarea
                    createTextareaInput(questionEl, question);
                    break;
                case 'grid':
                    createGridInput(questionEl, question);
                    break;
                case 'dropdown':
                    createDropdownInput(questionEl, question);
                    break;
                case 'date':
                    createDateInput(questionEl, question);
                    break;
                case 'display':
                    // No input needed for display questions
                    const displayNote = document.createElement('p');
                    displayNote.className = 'display-note';
                    questionEl.appendChild(displayNote);
                    break;
                default:
                    questionEl.innerHTML += `<p>Unsupported question type: ${question.type}</p>`;
            }

            return questionEl;
        }

        // Create radio input (for multiple choice questions)
        function createRadioInput(container, question) {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            question.options.forEach((option, index) => {
                const optionId = `${question.id}_${index}`;

                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = question.id;
                input.value = option.choice_index; // Store the choice ID
                input.id = optionId;

                const label = document.createElement('label');
                label.htmlFor = optionId;
                label.textContent = option.choice_text; // Display the choice text

                // Make the whole optionDiv clickable
                optionDiv.addEventListener('click', (e) => {
                    // Don't trigger if clicking directly on the input
                    if (e.target !== input) {
                        input.checked = !input.checked;
                        // Trigger change event for validation
                        const event = new Event('change');
                        input.dispatchEvent(event);
                    }
                });

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });

            container.appendChild(optionsContainer);
        }

        // Create checkbox input
        function createCheckboxInput(container, question) {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            question.options.forEach((option, index) => {
                const optionId = `${question.id}_${index}`;

                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.name = question.id;
                input.value = option.choice_index; // Store the choice ID
                input.id = optionId;

                const label = document.createElement('label');
                label.htmlFor = optionId;
                label.textContent = option.choice_text; // Display the choice text

                // Make the whole optionDiv clickable
                optionDiv.addEventListener('click', (e) => {
                    // Don't trigger if clicking directly on the input
                    if (e.target !== input) {
                        input.checked = !input.checked;
                        // Trigger change event for validation
                        const event = new Event('change');
                        input.dispatchEvent(event);
                    }
                });

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });

            container.appendChild(optionsContainer);
        }

        // Create text input (for short answer questions)
        function createTextInput(container, question) {
            let input;
            
            // Check for subtype
            if (question.subtype) {
                switch (question.subtype) {
                    case 'number':
                        input = document.createElement('input');
                        input.type = 'number';
                        break;
                    case 'email':
                        input = document.createElement('input');
                        input.type = 'email';
                        break;
                    case 'phone':
                        input = document.createElement('input');
                        input.type = 'tel';
                        break;
                    default:
                        input = document.createElement('input');
                        input.type = 'text';
                }
            } else {
                input = document.createElement('input');
                input.type = 'text';
            }
            
            input.name = question.id;
            input.id = question.id;
            input.className = 'text-input';
            
            // Add pattern for phone numbers if needed
            if (question.subtype === 'phone') {
                input.pattern = '09[0-9]{9}';
                input.title = 'Please enter a valid phone number';
            }
            
            container.appendChild(input);
        }

        // Create textarea input (for paragraph answers)
        function createTextareaInput(container, question) {
            const textarea = document.createElement('textarea');
            textarea.name = question.id;
            textarea.id = question.id;
            container.appendChild(textarea);
        }

        // Create dropdown (select) input
        function createDropdownInput(container, question) {
            const select = document.createElement('select');
            select.name = question.id;
            select.id = question.id;
            select.className = 'dropdown-input';

            // Add default empty option
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- Select an option --';
            defaultOption.disabled = true;
            defaultOption.selected = true;
            select.appendChild(defaultOption);

            // Add options
            question.options.forEach((option, index) => {
                const optionEl = document.createElement('option');
                optionEl.value = option.choice_index; // Store the choice ID
                optionEl.textContent = option.choice_text; // Display the choice text
                select.appendChild(optionEl);
            });

            container.appendChild(select);
        }

        // Create date input
        function createDateInput(container, question) {
            const input = document.createElement('input');
            input.type = 'date';
            input.name = question.id;
            input.id = question.id;
            input.className = 'date-input';
            container.appendChild(input);
        }

        function createGridInput(container, question) {
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid-question';

            const table = document.createElement('table');
            table.className = 'grid-table';

            // Create header row with options
            const headerRow = document.createElement('tr');
            const emptyHeader = document.createElement('th');
            headerRow.appendChild(emptyHeader);

            question.options.forEach(option => {
                const th = document.createElement('th');
                th.textContent = option.choice_text;
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            // Create rows with radio buttons
            question.rows.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                tr.dataset.subQuestionIndex = row.sub_question_index; // Store actual sub_question_index

                const rowHeader = document.createElement('td');
                rowHeader.textContent = row.sub_question_text;
                tr.appendChild(rowHeader);

                question.options.forEach((option, optionIndex) => {
                    const td = document.createElement('td');
                    td.className = 'grid-cell';
                    td.style.cursor = 'pointer';

                    // Create radio button
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `${question.id}_${rowIndex}`; // Still use rowIndex for name
                    radio.value = option.choice_index;
                    radio.dataset.questionId = question.id;
                    radio.dataset.rowIndex = rowIndex;
                    radio.dataset.subQuestionIndex = row.sub_question_index; // Store actual sub_question_index
                    radio.style.display = 'none';

                    // Create visual indicator
                    const radioVisual = document.createElement('div');
                    radioVisual.className = 'radio-visual';

                    // Add click handler
                    td.addEventListener('click', (e) => {
                        if (e.target !== radio) {
                            radio.checked = true;
                            updateRadioVisuals(tr);
                            const event = new Event('change');
                            radio.dispatchEvent(event);
                        }
                    });

                    td.appendChild(radio);
                    td.appendChild(radioVisual);
                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });

            gridDiv.appendChild(table);
            container.appendChild(gridDiv);

            // Add CSS for the grid (same as before)
            const style = document.createElement('style');
            style.textContent = `
                .grid-table {
                    width: 100%;
                    border-collapse: collapse;
                    margin: 15px 0;
                }
                .grid-table th, .grid-table td {
                    padding: 12px;
                    text-align: center;
                    border: 1px solid #e0e0e0;
                }
                .grid-table th {
                    background-color: #f5f5f5;
                    font-weight: 600;
                }
                .grid-cell {
                    position: relative;
                    transition: background-color 0.2s;
                }
                .grid-cell:hover {
                    background-color: #f9f9f9;
                }
                .radio-visual {
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    border: 2px solid #ccc;
                    margin: 0 auto;
                    position: relative;
                    transition: all 0.2s;
                }
                input[type="radio"]:checked + .radio-visual {
                    border-color: #4fbc9c;
                    background-color: #4fbc9c;
                }
                input[type="radio"]:checked + .radio-visual::after {
                    content: '';
                    position: absolute;
                    top: 3px;
                    left: 3px;
                    width: 6px;
                    height: 6px;
                    border-radius: 50%;
                    background: white;
                }
            `;
            container.appendChild(style);
        }

        function updateRadioVisuals(row) {
            const cells = row.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                const radioVisual = cell.querySelector('.radio-visual');
                if (radioVisual) {
                    radioVisual.classList.remove('checked');
                }
            });
            
            const checkedRadio = row.querySelector('input[type="radio"]:checked');
            if (checkedRadio && checkedRadio.nextElementSibling) {
                checkedRadio.nextElementSibling.classList.add('checked');
            }
        }
        
        // Apply saved responses to the form
        function applySavedResponses() {
            if (!savedResponse || !savedResponse.formId) return;
            
            // Loop through all questions in the saved response
            for (const [questionId, responseData] of Object.entries(savedResponse)) {
                if (questionId === 'formId') continue;
                
                const questionEl = document.querySelector(`[data-question-id="${questionId}"]`);
                if (!questionEl) continue;
                
                const questionType = questionEl.dataset.questionType;
                
                if (questionType === 'grid') {
                    // Handle grid answers
                    if (Array.isArray(responseData.value)) {
                        responseData.value.forEach(gridAnswer => {
                            // Find the row with matching sub_question_index
                            const row = document.querySelector(`tr[data-sub-question-index="${gridAnswer.rowIndex}"]`);
                            if (row) {
                                const radio = row.querySelector(`input[value="${gridAnswer.optionIndex}"]`);
                                if (radio) {
                                    radio.checked = true;
                                    updateRadioVisuals(row);
                                }
                            }
                        });
                    }
                } else if (questionType === 'checkbox') {
                    // Handle checkbox answers (multiple possible)
                    if (Array.isArray(responseData.value)) {
                        responseData.value.forEach(value => {
                            const input = document.querySelector(
                                `input[name="${questionId}"][value="${value}"]`
                            );
                            if (input) {
                                input.checked = true;
                            }
                        });
                    }
                } else if (questionType === 'multiple') {  // Changed from 'radio' to 'multiple'
                    // Handle radio answers (single selection)
                    if (responseData.value && responseData.value.length > 0) {
                        const input = document.querySelector(
                            `input[name="${questionId}"][value="${responseData.value[0]}"]`
                        );
                        if (input) {
                            input.checked = true;
                        }
                    }
                } else if (questionType === 'short' || questionType === 'paragraph' || questionType === 'date') {
                    // Handle text inputs (short, paragraph, date)
                    const input = document.querySelector(
                        `input[name="${questionId}"], 
                        textarea[name="${questionId}"],
                        input[type="date"][name="${questionId}"]`
                    );
                    if (input && responseData.value) {
                        input.value = responseData.value;
                    }
                } else if (questionType === 'dropdown') {
                    // Handle dropdown inputs
                    const select = document.querySelector(
                        `select[name="${questionId}"]`
                    );
                    if (select && responseData.value && responseData.value.length > 0) {
                        select.value = responseData.value[0];
                    }
                }
            }
            
            showAutosaveStatus('Previously saved answers loaded', false);
            validateCurrentSection();
        }
        
        // Validate the form before submission
        function validateForm(isAutosave = false) {
            let isValid = true;
            const requiredQuestions = [];
            
            // Clear previous error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            
            // Hide section error
            sectionErrorEl.classList.remove('show');
            sectionErrorEl.textContent = '';
            
            // Check all required questions
            formData.sections.forEach(section => {
                section.questions.forEach(question => {
                    if (question.type === 'display') return;
                    if (question.required && !isAutosave) {
                        const questionEl = document.querySelector(`[data-question-id="${question.id}"]`);
                        const errorEl = questionEl.querySelector('.error-message');
                        
                        let isAnswered = false;
                        let isValidAnswer = true;
                        let validationMessage = '';
                        
                        switch (question.type) {
                            case 'multiple':
                                const checkedRadio = questionEl.querySelector(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedRadio !== null;
                                break;
                            case 'checkbox':
                                const checkedCheckboxes = questionEl.querySelectorAll(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedCheckboxes.length > 0;
                                break;
                            case 'short':
                                const textInput = questionEl.querySelector(`input[name="${question.id}"]`);
                                if (textInput) {
                                    isAnswered = textInput.value.trim() !== '';
                                    
                                    // Validate subtype if exists
                                    if (isAnswered && question.subtype) {
                                        [isValidAnswer, validationMessage] = validateSubtype(textInput.value.trim(), question.subtype);
                                    }
                                }
                                break;
                            case 'paragraph':
                                const textareaInput = questionEl.querySelector(`textarea[name="${question.id}"]`);
                                isAnswered = textareaInput && textareaInput.value.trim() !== '';
                                break;
                            case 'dropdown':
                                const selectInput = questionEl.querySelector(`select[name="${question.id}"]`);
                                isAnswered = selectInput && selectInput.value !== '';
                                break;
                            case 'date':
                                const dateInput = questionEl.querySelector(`input[type="date"][name="${question.id}"]`);
                                isAnswered = dateInput && dateInput.value !== '';
                                break;
                            case 'grid':
                                // For grids, we need at least one radio selected per row
                                const gridRows = question.rows.length;
                                let answeredRows = 0;
                                
                                for (let i = 0; i < gridRows; i++) {
                                    if (document.querySelector(`input[name="${question.id}_${i}"]:checked`)) {
                                        answeredRows++;
                                    }
                                }
                                
                                isAnswered = answeredRows === gridRows;
                                break;
                        }
                        
                        if (!isAnswered) {
                            isValid = false;
                            errorEl.textContent = 'This question is required';
                            errorEl.classList.add('show');
                            requiredQuestions.push(question.id);
                            
                            // Scroll to first error
                            if (requiredQuestions.length === 1) {
                                questionEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        } else if (!isValidAnswer) {
                            isValid = false;
                            errorEl.textContent = validationMessage;
                            errorEl.classList.add('show');
                            requiredQuestions.push(question.id);
                        }
                    }
                });
            });
            
            return isValid;
        }
        
        // Collect form data for submission
        function collectFormData(isAutosave = false) {
            const formDataToSubmit = {
                form_index: parseInt(formId),
                answers: [],
                grid_answers: [],
                is_autosave: isAutosave
            };
            
            // Process all questions
            formData.sections.forEach(section => {
                section.questions.forEach(question => {
                    if (question.type === 'display') return;
                    switch (question.type) {
                        case 'multiple': // radio buttons
                            const checkedRadio = document.querySelector(
                                `[data-question-id="${question.id}"] input[name="${question.id}"]:checked`
                            );
                            
                            if (checkedRadio) {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(checkedRadio.value),
                                    text_answer: null
                                });
                            }
                            break;
                            
                        case 'checkbox':
                            const checkedCheckboxes = document.querySelectorAll(
                                `[data-question-id="${question.id}"] input[name="${question.id}"]:checked`
                            );
                            
                            checkedCheckboxes.forEach(input => {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(input.value),
                                    text_answer: null
                                });
                            });
                            break;
                            
                        case 'short':
                        case 'paragraph':
                            const textInput = document.querySelector(
                                `[data-question-id="${question.id}"] input[name="${question.id}"], 
                                [data-question-id="${question.id}"] textarea[name="${question.id}"]`
                            );
                            
                            if (textInput) {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: null,
                                    text_answer: textInput.value.trim()
                                });
                            }
                            break;
                            
                        case 'dropdown':
                            const selectInput = document.querySelector(
                                `[data-question-id="${question.id}"] select[name="${question.id}"]`
                            );
                            
                            if (selectInput && selectInput.value !== '') {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(selectInput.value),
                                    text_answer: null
                                });
                            }
                            break;
                            
                        case 'date':
                            const dateInput = document.querySelector(
                                `[data-question-id="${question.id}"] input[type="date"][name="${question.id}"]`
                            );
                            
                            if (dateInput && dateInput.value !== '') {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: null,
                                    text_answer: dateInput.value
                                });
                            }
                            break;
                            
                        case 'grid':
                            question.rows.forEach((row, rowIndex) => {
                                const checkedRadio = document.querySelector(
                                    `input[name="${question.id}_${rowIndex}"]:checked`
                                );
                                
                                if (checkedRadio) {
                                    // Get the actual sub_question_index from the data attribute
                                    const subQuestionIndex = parseInt(checkedRadio.dataset.subQuestionIndex);
                                    
                                    formDataToSubmit.grid_answers.push({
                                        main_question_index: parseInt(question.id),
                                        sub_question_index: subQuestionIndex, // Use actual sub_question_index
                                        choice_index: parseInt(checkedRadio.value)
                                    });
                                }
                            });
                            break;
                    }
                }); 
            });
            
            return formDataToSubmit;
        }
        
        // Save draft (autosave)
        async function saveDraft() {
            if (!hasChanges) return;
            
            try {
                // Don't validate for autosave
                const formDataToSubmit = collectFormData(true);
                
                const response = await fetch('../backend/forms/submit_response.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formDataToSubmit)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAutosaveStatus('Draft saved automatically', true);
                    hasChanges = false;
                } else {
                    showAutosaveStatus('Failed to save draft', false);
                }
            } catch (error) {
                console.error('Error saving draft:', error);
                showAutosaveStatus('Error saving draft', false);
            }
        }
        
        // Submit the form
        async function submitForm() {
            if (!validateForm()) {
                return;
            }
            
            try {
                submitFormBtn.disabled = true;
                submitFormBtn.textContent = 'Submitting...';
                
                const formDataToSubmit = collectFormData(false);
                
                const response = await fetch('../backend/forms/submit_response.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formDataToSubmit)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Stop autosave
                    if (autosaveInterval) {
                        clearInterval(autosaveInterval);
                    }
                    
                    // Show success message
                    alert('Form submitted successfully!');
                    window.location.href = 'main.php'; // Redirect to confirmation page
                } else {
                    alert('Failed to submit form. Please try again.');
                    submitFormBtn.disabled = false;
                    submitFormBtn.textContent = 'Submit Form';
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('An error occurred while submitting the form.');
                submitFormBtn.disabled = false;
                submitFormBtn.textContent = 'Submit Form';
            }
        }
        
        // Show autosave status message
        function showAutosaveStatus(message, isSuccess) {
            autosaveStatusEl.textContent = message;
            autosaveStatusEl.style.color = isSuccess ? '#27ae60' : '#e74c3c';
            
            // Hide after 3 seconds
            setTimeout(() => {
                if (autosaveStatusEl.textContent === message) {
                    autosaveStatusEl.textContent = '';
                }
            }, 3000);
        }
        
        // Event listeners
        saveDraftBtn.addEventListener('click', async () => {
            saveDraftBtn.disabled = true;
            saveDraftBtn.textContent = 'Saving...';
            
            await saveDraft();
            
            saveDraftBtn.disabled = false;
            saveDraftBtn.textContent = 'Save Draft';
        });
        
        submitFormBtn.addEventListener('click', submitForm);
        
        // Navigation button event listeners
        prevSectionBtn.addEventListener('click', () => {
            navigateToPage(currentPageIndex - 1);
        });
        
        nextSectionBtn.addEventListener('click', attemptNextSection);
    </script>
</body>
