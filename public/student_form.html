<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form Response</title>
    <link rel="stylesheet" href="css/student-form.css">

</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title" id="formTitle">Loading Form...</h1>
            <p class="form-description" id="formDescription"></p>
        </div>
        
        <div id="formSections"></div>
        
        <div class="action-buttons">
            <button id="saveDraftBtn" class="save-btn">Save Draft</button>
            <button id="submitFormBtn" class="submit-btn">Submit Form</button>
        </div>
        <div id="autosaveStatus" class="autosave-status"></div>
    </div>

    <script>
        // Global variables
        let formData = null;
        let formId = null;
        let savedResponse = null;
        let autosaveInterval = null;
        let autosaveTimeout = null;
        let hasChanges = false;
        
        // DOM elements
        const formTitleEl = document.getElementById('formTitle');
        const formDescriptionEl = document.getElementById('formDescription');
        const formSectionsEl = document.getElementById('formSections');
        const saveDraftBtn = document.getElementById('saveDraftBtn');
        const submitFormBtn = document.getElementById('submitFormBtn');
        const autosaveStatusEl = document.getElementById('autosaveStatus');
        
        // Initialize the form
        document.addEventListener('DOMContentLoaded', async function() {
            // Get form ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            formId = urlParams.get('id');
            
            if (!formId) {
                alert('No form ID specified in URL');
                return;
            }
            
            try {
                // Load form structure
                await loadFormData();
                
                // Load any saved response
                await loadSavedResponse();
                
                // Render the form
                renderForm();
                
                // Set up change detection
                setupChangeDetection();
                
                // Start autosave timer (every 30 seconds as fallback)
                autosaveInterval = setInterval(() => {
                    if (hasChanges) {
                        saveDraft();
                    }
                }, 30000);
                
            } catch (error) {
                console.error('Error initializing form:', error);
                alert('Failed to load form. Please try again.');
            }
        });
        
        // Set up event listeners to detect form changes
        function setupChangeDetection() {
            // Listen for all input changes
            formSectionsEl.addEventListener('change', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    triggerAutosave();
                }
            });
            
            // Listen for text input (for textareas and text inputs)
            formSectionsEl.addEventListener('input', function(e) {
                if (e.target.tagName === 'TEXTAREA' || 
                    (e.target.tagName === 'INPUT' && e.target.type === 'text')) {
                    triggerAutosave();
                }
            });
        }
        
        // Trigger autosave with debounce
        function triggerAutosave() {
            hasChanges = true;
            
            // Clear any pending timeout
            if (autosaveTimeout) {
                clearTimeout(autosaveTimeout);
            }
            
            // Set new timeout (debounce 1.5 seconds)
            autosaveTimeout = setTimeout(() => {
                if (hasChanges) {
                    saveDraft();
                }
            }, 1500);
        }
        
        // Load form structure from server
        async function loadFormData() {
            const response = await fetch(`../backend/forms/get_form_student.php?id=${formId}`);
            if (!response.ok) {
                throw new Error('Failed to load form data');
            }
            formData = await response.json();
            
            // Update header
            formTitleEl.textContent = formData.form_name;
            formDescriptionEl.textContent = formData.description || '';
        }
        
        // Load saved response if exists
        async function loadSavedResponse() {
            try {
                const response = await fetch(`../backend/forms/get_saved_response.php?formId=${formId}`);
                if (!response.ok) {
                    throw new Error('Failed to check for saved response');
                }
                savedResponse = await response.json();
            } catch (error) {
                console.error('Error loading saved response:', error);
            }
        }
        
        // Render the form sections and questions
        function renderForm() {
            formSectionsEl.innerHTML = '';
            
            if (!formData || !formData.sections) {
                formSectionsEl.innerHTML = '<p>No form sections found.</p>';
                return;
            }
            
            // Sort sections by order
            const sortedSections = [...formData.sections].sort((a, b) => a.order - b.order);
            
            sortedSections.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section';
                sectionEl.dataset.sectionId = section.id;
                
                // Section header
                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'section-header';
                
                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'section-title';
                sectionTitle.textContent = section.title;
                
                const sectionDesc = document.createElement('p');
                sectionDesc.className = 'section-description';
                sectionDesc.textContent = section.description || '';
                
                sectionHeader.appendChild(sectionTitle);
                sectionHeader.appendChild(sectionDesc);
                sectionEl.appendChild(sectionHeader);
                
                // Questions
                if (section.questions && section.questions.length > 0) {
                    section.questions.forEach(question => {
                        sectionEl.appendChild(createQuestionElement(question));
                    });
                } else {
                    const noQuestions = document.createElement('p');
                    sectionEl.appendChild(noQuestions);
                }
                
                formSectionsEl.appendChild(sectionEl);
            });
            
            // Apply saved responses if they exist
            if (savedResponse) {
                applySavedResponses();
            }
        }
        
        // Create a question element based on its type
        function createQuestionElement(question) {
            const questionEl = document.createElement('div');
            questionEl.className = 'question';
            questionEl.dataset.questionId = question.id;
            questionEl.dataset.questionType = question.type;

            // Question text
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = question.question;

            if (question.required) {
                const requiredStar = document.createElement('span');
                requiredStar.className = 'required-star';
                requiredStar.textContent = ' *';
                questionText.appendChild(requiredStar);
            }

            questionEl.appendChild(questionText);

            // Error message placeholder
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message hidden';
            questionEl.appendChild(errorEl);

            // Create input based on question type
            switch (question.type) {
                case 'multiple': // radio buttons
                    createRadioInput(questionEl, question);
                    break;
                case 'checkbox':
                    createCheckboxInput(questionEl, question);
                    break;
                case 'short': // text input
                    createTextInput(questionEl, question);
                    break;
                case 'paragraph': // textarea
                    createTextareaInput(questionEl, question);
                    break;
                case 'grid':
                    createGridInput(questionEl, question);
                    break;
                case 'dropdown':
                    createDropdownInput(questionEl, question);
                    break;
                case 'date':
                    createDateInput(questionEl, question);
                    break;
                case 'display':
                    // No input needed for display questions
                    const displayNote = document.createElement('p');
                    displayNote.className = 'display-note';
                    questionEl.appendChild(displayNote);
                    break;
                default:
                    questionEl.innerHTML += `<p>Unsupported question type: ${question.type}</p>`;
            }

            return questionEl;
        }

        // Create radio input (for multiple choice questions)
        function createRadioInput(container, question) {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            question.options.forEach((option, index) => {
                const optionId = `${question.id}_${option.choice_index}`;

                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = question.id;
                input.value = option.choice_index;
                input.id = optionId;

                const label = document.createElement('label');
                label.htmlFor = optionId;
                label.textContent = option.choice_text;

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });

            container.appendChild(optionsContainer);
        }

        // Create checkbox input
        function createCheckboxInput(container, question) {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            question.options.forEach((option, index) => {
                const optionId = `${question.id}_${option.choice_index}`;

                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.name = question.id;
                input.value = option.choice_index;
                input.id = optionId;

                const label = document.createElement('label');
                label.htmlFor = optionId;
                label.textContent = option.choice_text;

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });

            container.appendChild(optionsContainer);
        }

        // Create text input (for short answer questions)
        function createTextInput(container, question) {
            const input = document.createElement('input');
            input.type = 'text';
            input.name = question.id;
            input.id = question.id;
            input.className = 'text-input';
            container.appendChild(input);
        }

        // Create textarea input (for paragraph answers)
        function createTextareaInput(container, question) {
            const textarea = document.createElement('textarea');
            textarea.name = question.id;
            textarea.id = question.id;
            container.appendChild(textarea);
        }

        // Create dropdown (select) input
        function createDropdownInput(container, question) {
            const select = document.createElement('select');
            select.name = question.id;
            select.id = question.id;
            select.className = 'dropdown-input';

            // Add default empty option
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- Select an option --';
            defaultOption.disabled = true;
            defaultOption.selected = true;
            select.appendChild(defaultOption);

            // Add options
            question.options.forEach(option => {
                const optionEl = document.createElement('option');
                optionEl.value = option.choice_index;
                optionEl.textContent = option.choice_text;
                select.appendChild(optionEl);
            });

            container.appendChild(select);
        }

        // Create date input
        function createDateInput(container, question) {
            const input = document.createElement('input');
            input.type = 'date';
            input.name = question.id;
            input.id = question.id;
            input.className = 'date-input';
            container.appendChild(input);
        }

        // Create grid (matrix) input
        function createGridInput(container, question) {
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid-question';

            const table = document.createElement('table');
            table.className = 'grid-table';

            // Create header row with options
            const headerRow = document.createElement('tr');
            const emptyHeader = document.createElement('th');
            headerRow.appendChild(emptyHeader);

            question.options.forEach(option => {
                const th = document.createElement('th');
                th.textContent = option.choice_text;
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            // Create rows with radio buttons
            question.rows.forEach((rowText, rowIndex) => {
                const row = document.createElement('tr');

                const rowHeader = document.createElement('td');
                rowHeader.textContent = rowText;
                row.appendChild(rowHeader);

                question.options.forEach(option => {
                    const td = document.createElement('td');

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `${question.id}_${rowIndex}`;
                    radio.value = option.choice_index;
                    radio.dataset.questionId = question.id;
                    radio.dataset.rowIndex = rowIndex;

                    td.appendChild(radio);
                    row.appendChild(td);
                });

                table.appendChild(row);
            });

            gridDiv.appendChild(table);
            container.appendChild(gridDiv);
        }
        
        
        // Apply saved responses to the form
        function applySavedResponses() {
            if (!savedResponse || !savedResponse.formId) return;
            
            // Loop through all questions in the saved response
            for (const [questionId, responseData] of Object.entries(savedResponse)) {
                if (questionId === 'formId') continue;
                
                const questionEl = document.querySelector(`[data-question-id="${questionId}"]`);
                if (!questionEl) continue;
                
                const questionType = questionEl.dataset.questionType;
                
                if (questionType === 'grid') {
                    // Handle grid answers
                    if (Array.isArray(responseData.value)) {
                        responseData.value.forEach(gridAnswer => {
                            const radio = document.querySelector(
                                `input[name="${questionId}_${gridAnswer.rowIndex}"][value="${gridAnswer.optionIndex}"]`
                            );
                            if (radio) {
                                radio.checked = true;
                            }
                        });
                    }
                } else if (questionType === 'checkbox') {
                    // Handle checkbox answers (multiple possible)
                    if (Array.isArray(responseData.value)) {
                        responseData.value.forEach(value => {
                            const input = document.querySelector(
                                `input[name="${questionId}"][value="${value}"]`
                            );
                            if (input) {
                                input.checked = true;
                            }
                        });
                    }
                } else if (questionType === 'radio') {
                    // Handle radio answers (single selection)
                    if (responseData.value && responseData.value.length > 0) {
                        const input = document.querySelector(
                            `input[name="${questionId}"][value="${responseData.value[0]}"]`
                        );
                        if (input) {
                            input.checked = true;
                        }
                    }
                } else if (questionType === 'text' || questionType === 'textarea') {
                    // Handle text inputs
                    const input = document.querySelector(
                        `input[name="${questionId}"], textarea[name="${questionId}"]`
                    );
                    if (input && responseData.value) {
                        input.value = responseData.value;
                    }
                }
            }
            
            showAutosaveStatus('Previously saved answers loaded', false);
        }
        
        // Validate the form before submission
        function validateForm(isAutosave = false) {
            let isValid = true;
            const requiredQuestions = [];
            
            // Clear previous error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
            
            // Check all required questions
            formData.sections.forEach(section => {
                section.questions.forEach(question => {
                    if (question.type === 'display') return;
                    if (question.required && !isAutosave) {
                        const questionEl = document.querySelector(`[data-question-id="${question.id}"]`);
                        const errorEl = questionEl.querySelector('.error-message');
                        
                        let isAnswered = false;
                        
                        switch (question.type) {
                            case 'multiple':
                                const checkedRadio = questionEl.querySelector(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedRadio !== null;
                                break;
                            case 'checkbox':
                                const checkedCheckboxes = questionEl.querySelectorAll(`input[name="${question.id}"]:checked`);
                                isAnswered = checkedCheckboxes.length > 0;
                                break;
                            case 'short':
                                const textInput = questionEl.querySelector(`input[name="${question.id}"]`);
                                isAnswered = textInput && textInput.value.trim() !== '';
                                break;
                            case 'paragraph':
                                const textareaInput = questionEl.querySelector(`textarea[name="${question.id}"]`);
                                isAnswered = textareaInput && textareaInput.value.trim() !== '';
                                break;
                            case 'dropdown':
                                const selectInput = questionEl.querySelector(`select[name="${question.id}"]`);
                                isAnswered = selectInput && selectInput.value !== '';
                                break;
                            case 'date':
                                const dateInput = questionEl.querySelector(`input[type="date"][name="${question.id}"]`);
                                isAnswered = dateInput && dateInput.value !== '';
                                break;
                            case 'grid':
                                // For grids, we need at least one radio selected per row
                                const gridRows = question.rows.length;
                                let answeredRows = 0;
                                
                                for (let i = 0; i < gridRows; i++) {
                                    if (document.querySelector(`input[name="${question.id}_${i}"]:checked`)) {
                                        answeredRows++;
                                    }
                                }
                                
                                isAnswered = answeredRows === gridRows;
                                break;
                        }
                        
                        if (!isAnswered) {
                            isValid = false;
                            errorEl.textContent = 'This question is required';
                            errorEl.classList.remove('hidden');
                            requiredQuestions.push(question.id);
                            
                            // Scroll to first error
                            if (requiredQuestions.length === 1) {
                                questionEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    }
                });
            });
            
            return isValid;
        }
        
        // Collect form data for submission
        function collectFormData(isAutosave = false) {
            const formDataToSubmit = {
                form_index: parseInt(formId),
                answers: [],
                grid_answers: [],
                is_autosave: isAutosave
            };
            
            // Process all questions
            formData.sections.forEach(section => {
                section.questions.forEach(question => {
                    if (question.type === 'display') return;
                    switch (question.type) {
                        case 'multiple':
                            const checkedRadio = document.querySelector(
                                `[data-question-id="${question.id}"] input[name="${question.id}"]:checked`
                            );
                            
                            if (checkedRadio) {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(checkedRadio.value)
                                });
                            }
                            break;
                            
                        case 'checkbox':
                            const checkedCheckboxes = document.querySelectorAll(
                                `[data-question-id="${question.id}"] input[name="${question.id}"]:checked`
                            );
                            
                            checkedCheckboxes.forEach(input => {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(input.value)
                                });
                            });
                            break;
                            
                        case 'short':
                        case 'paragraph':
                            const textInput = document.querySelector(
                                `[data-question-id="${question.id}"] input[name="${question.id}"], 
                                [data-question-id="${question.id}"] textarea[name="${question.id}"]`
                            );
                            
                            if (textInput && textInput.value.trim() !== '') {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: null,
                                    text_answer: textInput.value.trim()
                                });
                            }
                            break;
                            
                        case 'dropdown':
                            const selectInput = document.querySelector(
                                `[data-question-id="${question.id}"] select[name="${question.id}"]`
                            );
                            
                            if (selectInput && selectInput.value !== '') {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: parseInt(selectInput.value)
                                });
                            }
                            break;
                            
                        case 'date':
                            const dateInput = document.querySelector(
                                `[data-question-id="${question.id}"] input[type="date"][name="${question.id}"]`
                            );
                            
                            if (dateInput && dateInput.value !== '') {
                                formDataToSubmit.answers.push({
                                    main_question_index: parseInt(question.id),
                                    choice_index: null,
                                    text_answer: dateInput.value
                                });
                            }
                            break;
                            
                        case 'grid':
                            question.rows.forEach((row, rowIndex) => {
                                const checkedRadio = document.querySelector(
                                    `input[name="${question.id}_${rowIndex}"]:checked`
                                );
                                
                                if (checkedRadio) {
                                    formDataToSubmit.grid_answers.push({
                                        main_question_index: parseInt(question.id),
                                        sub_question_index: parseInt(rowIndex),
                                        choice_index: parseInt(checkedRadio.value)
                                    });
                                }
                            });
                            break;
                    }
                });
            });
            
            return formDataToSubmit;
        }
        
        // Save draft (autosave)
        async function saveDraft() {
            if (!hasChanges) return;
            
            try {
                // Don't validate for autosave
                const formDataToSubmit = collectFormData(true);
                
                const response = await fetch('../backend/forms/submit_response.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formDataToSubmit)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAutosaveStatus('Draft saved automatically', true);
                    hasChanges = false;
                } else {
                    showAutosaveStatus('Failed to save draft', false);
                }
            } catch (error) {
                console.error('Error saving draft:', error);
                showAutosaveStatus('Error saving draft', false);
            }
        }
        
        // Submit the form
        async function submitForm() {
            if (!validateForm()) {
                return;
            }
            
            try {
                submitFormBtn.disabled = true;
                submitFormBtn.textContent = 'Submitting...';
                
                const formDataToSubmit = collectFormData(false);
                
                const response = await fetch('../backend/forms/submit_response.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formDataToSubmit)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Stop autosave
                    if (autosaveInterval) {
                        clearInterval(autosaveInterval);
                    }
                    
                    // Show success message
                    alert('Form submitted successfully!');
                    window.location.href = 'submission_confirmation.html'; // Redirect to confirmation page
                } else {
                    alert('Failed to submit form. Please try again.');
                    submitFormBtn.disabled = false;
                    submitFormBtn.textContent = 'Submit Form';
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('An error occurred while submitting the form.');
                submitFormBtn.disabled = false;
                submitFormBtn.textContent = 'Submit Form';
            }
        }
        
        // Show autosave status message
        function showAutosaveStatus(message, isSuccess) {
            autosaveStatusEl.textContent = message;
            autosaveStatusEl.style.color = isSuccess ? '#27ae60' : '#e74c3c';
            
            // Hide after 3 seconds
            setTimeout(() => {
                if (autosaveStatusEl.textContent === message) {
                    autosaveStatusEl.textContent = '';
                }
            }, 3000);
        }
        
        // Event listeners
        saveDraftBtn.addEventListener('click', async () => {
            saveDraftBtn.disabled = true;
            saveDraftBtn.textContent = 'Saving...';
            
            await saveDraft();
            
            saveDraftBtn.disabled = false;
            saveDraftBtn.textContent = 'Save Draft';
        });
        
        submitFormBtn.addEventListener('click', submitForm);
    
    </script>

</body>
</html>
