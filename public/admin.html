<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="cgcc2.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main-page.css">
    <base href="Media/">
    <title>CGCC</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="cgcc.png" alt="cgcc-logo" class="logo-img">
            College Guidance and Counseling Center
        </div>
        <nav class="navigation">
            <a href="../main.html">Home</a>
            <a href="#">Contact</a>
            <a href="#">About Mental Health</a>
            <a href="#">FAQ</a>
        </nav>
    </header>

    <div class="grid-body">

        <div class="left-bg"></div>
        <div class="page-left">
            <div class="profile">
                <div class="profile-picture"></div>
                <span id="user-name"></span> <!-- papalitan ng id ni user -->
                    <div class="edit">
                        <a href="#">✎Edit Profile</a>
                    </div>
            </div>
            <div class="sidebar-nav">                    
            </div>
        </div>

        <div class="page-right">
            <div class="greetings">
                <div class="h1">
                    Hello, <span class="user-name"> </span>! Welcome to the College Guidance and Counseling Center!
                </div>
                <div class="subh1">
                    You Share, We Listen, We Care
                </div>
            </div>
        
            <div class="form-cards-section">
                <h2 class="section-title">Available Forms</h2>
                <div id="form-card-container" class="cards-grid">
                  <!-- Cards will be inserted here -->
                </div>
            </div>
        
            <div class="schedule">
                <button class="button-class" onclick="">
                    Manage Counselors
                </button>
            </div>
            <div class="update">
                <button class="button-class" onclick="http://localhost/cgcc-system/public/formbuilder.html">
                    Create a new form
                </button>
            </div>
        </div>
    </div>
<script>


const userName = localStorage.getItem('username') || 'Admin';  

document.getElementById('user-name').innerText = userName;
const greetingElements = document.querySelectorAll('.user-name');
greetingElements.forEach(element => {
    element.innerText = userName;
});

function toggleDropdown(id){
    const content = document.getElementById(id);
    content.style.display = content.style.display === "block" ? "none" : "block";
}

function goToPage(){
    const condition = true;
    if (condition){
        window.location.href = "../schedule-forms-uncompleted.html";
    } else{
        window.location.href = "../schedule-forms-uncompleted.html";
    }
}

// 🆕 Fetch and display forms
fetch('http://localhost/cgcc-system/backend/forms/form.php')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('form-card-container');
    if (!data || data.length === 0) {
      container.innerHTML = '<p>No forms available at the moment.</p>';
      return;
    }

    data.forEach(form => {
      const card = document.createElement('div');
      card.classList.add('form-card'); // Add your own styling class

      card.innerHTML = `
        <h3>${form.form_name}</h3>
        <p>${form.description || 'No description'}</p>
        <a href="http://localhost/cgcc-system/public/formbuilder.html?id=${form.form_index}" target="_blank">Open Form</a>
      `;

      container.appendChild(card);
    });
  })
  .catch(error => {
    console.error('Error fetching forms:', error);
    document.getElementById('form-card-container').innerHTML = '<p>Failed to load forms.</p>';
  });
</script>

</body>
</html>
