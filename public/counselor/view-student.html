<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../Media/cgcc2.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/view-student.css">
    <title>CGCC - View Student</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../Media/cgcc.png" alt="cgcc-logo" class="logo-img">
            College Guidance and Counseling Center
        </div>
    </header>

    <div class="grid-body">
        <div class="page-left">
            <h1 class="form-title">Student Information</h1>
            
            <div class="profile-section">
                <div class="profile-title">Profile Picture</div>
                <img src="../Media/user.jpg" alt="Profile Picture" class="profile-picture" id="profile-picture">
            </div>

            <div class="form-container">
                <div class="form-columns">
                    <div class="form-group">
                        <label for="student-number">Student Number</label>
                        <input readonly type="text" id="student-number" placeholder="Loading...">
                        
                        <label for="first-name">First Name</label>
                        <input readonly type="text" id="first-name" placeholder="Loading...">
                        
                        <label for="last-name">Last Name</label>
                        <input readonly type="text" id="last-name" placeholder="Loading...">
                    
                        <label for="year-level">Year Level</label>
                        <input readonly type="text" id="year-level" placeholder="Loading...">
                        
                        <label for="section">Section</label>
                        <input readonly type="text" id="section" placeholder="Loading...">
                        
                        <label for="department">Department</label>
                        <input readonly type="text" id="department" placeholder="Loading...">
                        
                        <label for="program">Program</label>
                        <input readonly type="text" id="program" placeholder="Loading...">
                    </div>

                    <div class="form-group-one">
                        <label for="email">Email</label>
                        <input readonly type="text" id="email" placeholder="Loading...">
                        
                        <label for="contact-number">Contact Number</label>
                        <input readonly type="text" id="contact-number" placeholder="Loading...">
                        
                        <br>
                        <label for="guardian">Guardian</label>
                        <input readonly type="text" id="guardian" placeholder="Loading...">
                        
                        <label for="guardian-contact">Guardian Contact No.</label>
                        <input readonly type="text" id="guardian-contact" placeholder="Loading...">

                        <div class="counselors-section">
                            <label>Assigned Counselors</label>
                            <div id="counselors-list" class="counselors-list">
                                <!-- Counselors will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="back" onclick="javascript:history.back()">Back</button>
        </div>
        
        <div class="page-right">
            <div class="responses-container">
                <h2 class="responses-title">Form Responses</h2>
                <div id="responses-list">
                    <div class="no-responses">Loading responses...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get student ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('id');
            
            if (!studentId) {
                alert('Student ID not provided');
                return;
            }

            // Fetch student data
            fetch(`../../backend/users/students.php?id=${studentId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Update the page with student data
                    const student = data.student;

                    // Format name to formal case (first letter capitalized, rest lowercase)
                    function toFormalCase(name) {
                        if (!name) return '';
                        return name.toLowerCase().split(' ').map(word => 
                            word.charAt(0).toUpperCase() + word.slice(1)
                        ).join(' ');
                    }

                    // Existing code that assigns guardian info
                    let guardianName = student.guardian_fullname;
                    let guardianContact = student.guardian_contact;
                    let studentEmail = student.student_email;

                    // If guardian info is empty or missing, assign default values
                    if (!guardianName || guardianName.trim() === '') {
                        guardianName = toFormalCase(`Jane ${student.last_name || ''}`.trim());
                    } else {
                        guardianName = toFormalCase(guardianName);
                    }
                    if (!guardianContact || guardianContact.trim() === '') {
                        guardianContact = '09123456789';
                    }
                    if (!studentEmail || studentEmail.trim() === '') {
                        studentEmail = `${student.first_name.toLowerCase() || ''}_${student.last_name.toLowerCase() || ''}@dlsl.edu.ph`.trim();
                    }
                    // Set the values in the input fields
                    document.getElementById('guardian').value = guardianName;
                    document.getElementById('guardian-contact').value = guardianContact;
                    document.getElementById('email').value = studentEmail;
                    document.getElementById('profile-picture').src = student.image_path;
                    document.getElementById('student-number').value = student.student_number;
                    document.getElementById('first-name').value = student.first_name;
                    document.getElementById('last-name').value = student.last_name;
                    document.getElementById('year-level').value = student.year_level;
                    document.getElementById('section').value = student.section_name;
                    document.getElementById('department').value = student.dept_code;
                    document.getElementById('program').value = student.program_code;
                    document.getElementById('contact-number').value = student.contact_number;


                    // Update responses
                    const responsesList = document.getElementById('responses-list');
                    if (data.responses && data.responses.length > 0) {
                        responsesList.innerHTML = '';
                        
                        // Group responses by form_id
                        const groupedResponses = {};
                        data.responses.forEach(response => {
                            if (!groupedResponses[response.form_index]) {
                                groupedResponses[response.form_index] = [];
                            }
                            groupedResponses[response.form_index].push(response);
                        });
                        
                        // Sort each group by date (newest first)
                        Object.keys(groupedResponses).forEach(formId => {
                            groupedResponses[formId].sort((a, b) => {
                                return new Date(b.created_at) - new Date(a.created_at);
                            });
                        });
                        
                        // Create UI for each form group
                        Object.keys(groupedResponses).forEach(formId => {
                            const formResponses = groupedResponses[formId];
                            const formName = formResponses[0].form_name;
                            const academicYear = formResponses[0].academic_year || 'N/A';
                            
                            const formGroup = document.createElement('div');
                            formGroup.className = 'form-container-group';
                            
                            const formHeader = document.createElement('div');
                            formHeader.className = 'form-header';
                            formHeader.innerHTML = `
                                <span class="form-name">${formName}</span>
                                <span class="response-count">${formResponses.length} response${formResponses.length > 1 ? 's' : ''}</span>
                            `;
                            
                            const formContent = document.createElement('div');
                            formContent.className = 'form-responses';
                            
                            // Add most recent response (highlighted)
                            const mostRecent = formResponses[0];
                            const date = new Date(mostRecent.created_at);
                            const formattedDate = date.toLocaleDateString('en-US', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                            
                            const recentCard = document.createElement('div');
                            recentCard.className = 'response-card recent-response';
                            recentCard.innerHTML = `
                                <div class="response-header">
                                    <span class="response-form-name">Most Recent</span>
                                    <span class="response-date">${formattedDate}</span>
                                </div>
                                <div class="response-details">
                                    <span>Academic Year: ${academicYear}</span>
                                    <span>Answers: ${mostRecent.answer_count}</span>
                                </div>
                            `;
                            
                            recentCard.addEventListener('click', () => {
                                window.location.href = `view-response.html?id=${mostRecent.response_index}`;
                            });
                            
                            formContent.appendChild(recentCard);
                            
                            // Add previous responses dropdown if there are more
                            if (formResponses.length > 1) {
                                const prevResponsesHeader = document.createElement('div');
                                prevResponsesHeader.className = 'previous-responses-header';
                                prevResponsesHeader.innerHTML = `
                                    <span>Previous Responses (${formResponses.length - 1})</span>
                                    <button class="view-all-btn">View All</button>
                                `;
                                
                                const prevResponsesContent = document.createElement('div');
                                prevResponsesContent.className = 'previous-responses-content';
                                prevResponsesContent.style.display = 'none';
                                
                                // Add previous responses
                                for (let i = 1; i < formResponses.length; i++) {
                                    const response = formResponses[i];
                                    const prevDate = new Date(response.created_at);
                                    const prevFormattedDate = prevDate.toLocaleDateString('en-US', {
                                        year: 'numeric',
                                        month: 'long',
                                        day: 'numeric',
                                        hour: '2-digit',
                                        minute: '2-digit'
                                    });
                                    
                                    const prevCard = document.createElement('div');
                                    prevCard.className = 'response-card previous-response';
                                    prevCard.innerHTML = `
                                        <div class="response-header">
                                            <span class="response-form-name">Response #${i + 1}</span>
                                            <span class="response-date">${prevFormattedDate}</span>
                                        </div>
                                        <div class="response-details">
                                            <span>Academic Year: ${academicYear}</span>
                                            <span>Answers: ${response.answer_count}</span>
                                        </div>
                                    `;
                                    
                                    prevCard.addEventListener('click', () => {
                                        window.location.href = `view-response.html?id=${response.response_index}`;
                                    });
                                    
                                    prevResponsesContent.appendChild(prevCard);
                                }
                                
                                prevResponsesHeader.querySelector('.view-all-btn').addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    if (prevResponsesContent.style.display === 'none') {
                                        prevResponsesContent.style.display = 'block';
                                    } else {
                                        prevResponsesContent.style.display = 'none';
                                    }
                                });
                                
                                formContent.appendChild(prevResponsesHeader);
                                formContent.appendChild(prevResponsesContent);
                            }
                            
                            formGroup.appendChild(formHeader);
                            formGroup.appendChild(formContent);
                            responsesList.appendChild(formGroup);
                        });
                    } else {
                        responsesList.innerHTML = '<div class="no-responses">No form responses found</div>';
                    }

                    // Update counselors list
                    const counselorsList = document.getElementById('counselors-list');
                    if (student.assigned_counselors && student.assigned_counselors.length > 0) {
                        student.assigned_counselors.forEach(counselor => {
                            const counselorDiv = document.createElement('div');
                            counselorDiv.className = 'counselor-item';
                            counselorDiv.innerHTML = `
                                <img src="${counselor.image_path}" alt="${counselor.full_name}" class="counselor-image">
                                <div class="counselor-info">
                                    <div class="counselor-name">${counselor.full_name}</div>
                                    ${counselor.credentials ? `<div class="counselor-credentials">${counselor.credentials}</div>` : ''}
                                </div>
                            `;
                            counselorsList.appendChild(counselorDiv);
                        });
                    } else {
                        counselorsList.innerHTML = '<div class="no-counselors">No counselors assigned</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading student data: ' + error.message);
                });
        });
    </script>
</body>
</html>
