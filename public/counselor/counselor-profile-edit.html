<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Counselor Profile</title>
      <link rel="icon" type="image/png" href="../Media/cgcc2.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/form.css">
    <style>
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ddd;
            margin-bottom: 10px;
        }
        .upload-btn {
            padding: 8px 15px;
            background-color: #4fbd9c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .upload-btn:hover {
            background-color: #249a76;
        }
        #profile-upload {
            display: none;
        }
        .assigned-programs {
            margin: 15px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .program-item {
            margin: 5px 0;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../Media/cgcc.png" alt="cgcc-logo" class="logo-img">
            College Guidance and Counseling Center
        </div>
    </header>

    <main class="form-container">
        <h1 class="form-title">Edit Counselor Profile</h1>
        
        <div id="message-container"></div>

        <form id="counselor-profile-form">
            <div class="profile-section">
                <img src="default-profile.png" 
                     alt="Profile Picture" 
                     class="profile-picture" 
                     id="profile-picture">
                <input type="file" id="profile-upload" accept="image/*">
                <button type="button" class="upload-btn" onclick="document.getElementById('profile-upload').click()">
                    Upload Photo
                </button>
            </div>

            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first_name" readonly>

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last_name" readonly>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" readonly>

            <label for="contact-number">Contact Number</label>
            <input type="tel" id="contact-number" name="contact_number" readonly>

            <label for="credentials">Credentials</label>
            <input type="text" id="credentials" name="credentials" 
                   placeholder="Enter your credentials (e.g., RPm, RGC)">

            <label for="calendar-link">Google Calendar Link</label>
            <input type="url" id="calendar-link" name="calendar_link" 
                   placeholder="Enter your Google Calendar link">

            <div class="assigned-programs" id="assigned-programs">
                <h3>Assigned Programs</h3>
                <p>Loading programs...</p>
            </div>

            <div class="button-container">
                <button type="submit">Save Changes</button>
                <button type="button" onclick="javascript:history.back()">Cancel</button>
            </div>
        </form>
    </main>

    <script>
        // Global variables
        let counselorData = {};
        let profileImageBase64 = null;

        // Fetch counselor data on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchCounselorData();
        });

        // Fetch counselor data
        async function fetchCounselorData() {
            try {
                const response = await fetch('../../backend/users/counselors/counselor-profile.php', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });

                const data = await response.json();

                if (data.success) {
                    counselorData = data.counselor;
                    displayCounselorData(data.counselor, data.assigned_program);
                } else {
                    showMessage('error', data.message || 'Failed to load profile data');
                }
            } catch (error) {
                showMessage('error', 'Network error: ' + error.message);
            }
        }

        // Format name to formal case (first letter capitalized, rest lowercase)
        function toFormalCase(name) {
            if (!name) return '';
            return name.toLowerCase().split(' ').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        // Display counselor data
        function displayCounselorData(counselor, program) {
            // Personal info
            document.getElementById('first-name').value = toFormalCase(counselor.first_name) || '';
            document.getElementById('last-name').value = toFormalCase(counselor.last_name) || '';
            document.getElementById('email').value = counselor.email || '';
            document.getElementById('contact-number').value = counselor.contact_number || '09953011635';
            document.getElementById('credentials').value = counselor.credentials || '';
            document.getElementById('calendar-link').value = counselor.calendar_link || '';
            
            // Profile picture
            if (counselor.image_path) {
                document.getElementById('profile-picture').src = counselor.image_path;
            }

            // Assigned program
            const programsContainer = document.getElementById('assigned-programs');
            if (program && program.program_code && program.program_name) {
                programsContainer.innerHTML = `
                    <h3>Assigned Program</h3>
                    <div class="program-item">
                        ${program.program_code} - ${toFormalCase(program.program_name)}
                    </div>
                `;
            } else {
                programsContainer.innerHTML = '<h3>Assigned Program</h3><p>No program assigned</p>';
            }
        }

        // Handle image upload
        document.getElementById('profile-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('profile-picture').src = event.target.result;
                    profileImageBase64 = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
          document.getElementById('counselor-profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                calendar_link: document.getElementById('calendar-link').value,
                credentials: document.getElementById('credentials').value,
            };

            if (profileImageBase64) {
                formData.profile_image = profileImageBase64;
            }

            try {
                const response = await fetch('../../backend/users/counselors/counselor-profile.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData),
                    credentials: 'same-origin'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('success', data.message);
                    // Update displayed data with returned counselor info
                    if (data.counselor) {
                        counselorData = data.counselor;
                        // Add a timestamp to prevent caching
                        document.getElementById('profile-picture').src = 
                            data.counselor.image_path + '?t=' + new Date().getTime() || 
                            'default-profile.png';
                    }
                } else {
                    showMessage('error', data.message || 'Failed to update profile');
                }
            } catch (error) {
                showMessage('error', 'Network error: ' + error.message);
            }
        });
        // Show message
        function showMessage(type, message) {
            const messageContainer = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);

            // Clear message after 5 seconds
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
