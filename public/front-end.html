<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>Login Page</title>
</head>
<body>
    <div class="grid">
        <div class="login">
            <div class="login-header">
                <b>Welcome!</b>
                <div class="login-sub">Log in to access your account</div>
            </div>
            <form class="login-form" action="../backend/login.php" method="post">
              <label for="email">Email</label>
              <input type="text" id="email" name="email" required>
              
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
              
              <input type="submit" value="Log In">
              
              <div class="divider">
                <span>or</span>
              </div>
              
              
              <a href="/auth/google" class="google-button">
                <img src="/Media/google-logo.svg" alt="Google logo"> Login with Google
              </a>
            </form>
        </div>
        <div class="image"></div>
    </div>
</body>
</html>
