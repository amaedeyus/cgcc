<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="cgcc2.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/manage-forms.css">
    <title>CGCC</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="cgcc.png" alt="cgcc-logo" class="logo-img">
            College Guidance and Counseling Center
        </div>
        <nav class="navigation">
            <a href="admin-manage-forms.html">Home</a>
            <a href="#">Contact</a>
            <a href="#">About Mental Health</a>
            <a href="#">FAQ</a>
        </nav>
    </header>

    <div class="grid-body">
        <div class="left-bg"></div>
            <div class="page-left">
                <div class="profile">
                    <div class="profile-picture"></div>
                    <span id="user-name"></span>
                    <div class="edit">
                        <a href="#">✎Edit Profile</a>
                    </div>
                </div>
                <div class="sidebar-nav">
                    <a href="admin-manage-forms.html" class="nav-link active">Manage Forms</a>
                    <a href="admin-manage-counselor.html" class="nav-link">Manage Counselors</a>
                    <a href="admin-manage-program.html" class="nav-link">Manage Programs</a>
                </div>
            </div>  

        <div class="page-right">
            <div class="greetings">
                <div class="h1">
                    Hello, <span class="user-name"> </span>! Welcome to the College Guidance and Counseling Center!
                </div>
                <div class="subh1">
                    You Share, We Listen, We Care
                </div>
            </div>

            <h2 class="section-title">Manage Forms</h2>
            <div class="form-cards-section">
                
                <div id="form-card-container" class="cards-grid">
                    <!-- Cards will be inserted here -->
                </div>
            </div>
            <!-- Floating Create Form Button -->
            <button class="floating-btn" onclick="location.href='formbuilder.html';" title="Create New Form">
                + Create Form
            </button>

        </div>
    </div>
    <script>
        const userName = localStorage.getItem('username') || 'Admin';

        document.getElementById('user-name').innerText = userName;
        const greetingElements = document.querySelectorAll('.user-name');
        greetingElements.forEach(element => {
            element.innerText = userName;
        });

        function toggleDropdown(id) {
            const content = document.getElementById(id);
            content.style.display = content.style.display === "block" ? "none" : "block";
        }

        function goToPage() {
            // talens
            // Example condition — adjust based on actual use case
            window.location.href = "../schedule-forms-uncompleted.html";
        }

        // Fetch and display forms
        async function loadForms() {
            try {
                const response = await fetch('http://localhost/cgcc/backend/forms/form.php');
                if (!response.ok) throw new Error("Failed to fetch form data");

                const data = await response.json();
                const container = document.getElementById('form-card-container');
                container.innerHTML = ''; // Clear existing content

                if (!data || !Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<p>No forms available at the moment.</p>';
                    return;
                }

                data.forEach(form => {
                    console.log("Description received:", form.description);
                    const card = document.createElement('div');
                    card.classList.add('form-card');

                    // Safely handle missing description
                    let description = form.description || 'No description';

                    // Truncate with ellipsis
                    const maxLength = 100;
                    const truncatedDescription = description.length > maxLength
                        ? description.substring(0, maxLength) + '...'
                        : description;

                    card.innerHTML = `
                    <h3>${form.form_name}</h3>
                    <p class="form-description">${truncatedDescription.replace(/\n/g, ' ')}</p>
                    <a href="http://localhost/cgcc/public/admin/formbuilder.html?id=${form.form_index}" target="_blank">Open Form</a>
                `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching forms:', error);
                document.getElementById('form-card-container').innerHTML = '<p>Failed to load forms.</p>';
            }
        }

        // Load forms on page load
        document.addEventListener('DOMContentLoaded', loadForms);
    </script>

</body>

</html>
