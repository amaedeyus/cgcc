<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="cgcc2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/manage-forms.css" />
  <title>CGCC</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="../Media/cgcc.png" alt="cgcc-logo" class="logo-img" />
      College Guidance and Counseling Center
    </div>
  </header>

  <div class="grid-body">
    <div class="left-bg"></div>
    <div class="page-left">
      <div class="profile">
        <div class="profile-picture"></div>
        <span id="user-name"></span>
      </div>
      <div class="sidebar-nav">
        <a href="admin-manage-forms.html" class="nav-link active">Manage Forms</a>
        <a href="admin-manage-counselor.html" class="nav-link">Manage Counselors</a>
        <a href="admin-manage-program.html" class="nav-link">Manage Programs</a>
        <a href="admin-archived-forms.html" class="nav-link">Archived Forms</a>
      </div>

      <div class="logout-wrapper">
        <form method="POST" action="../../backend/logout.php">
          <button type="submit" class="logout-btn">Log Out</button>
        </form>
      </div>
    </div>

    <div class="page-right">
      <div class="header-section">
        <h1>Form Management</h1>
        <p>Add, edit and manage guidance counseling forms</p>
      </div>

      <h2 class="section-title">Manage Forms</h2>
      <div class="form-cards-section">
        <div id="form-card-container" class="cards-grid">
          <!-- Cards will be inserted here -->
        </div>
      </div>
      <!-- Floating Create Form Button -->
      <button class="floating-btn" onclick="location.href='formbuilder.html';" title="Create New Form">
        + Create Form
      </button>
    </div>
  </div>

  <!-- Dropdown Menu -->
  <div id="dropdownMenu" class="dropdown-menu">
    <div class="dropdown-content">
      <div class="form-setting">
        <div class="status-label">
          <label>Form Status</label>
          <span class="info-icon"
            title="Toggle to publish/unpublish the form. Published forms are visible to students.">ⓘ</span>
        </div>
        <div class="status-controls">
          <label class="toggle-switch">
            <input type="checkbox" id="dropdownStatusToggle" />
            <span class="slider"></span>
          </label>
          <span id="dropdownStatusText" class="status-text"></span>
        </div>
      </div>
      <div class="form-setting">
        <div class="status-label">
          <label>Required for Counseling</label>
          <span class="info-icon"
            title="When enabled, students must complete this form before scheduling counseling sessions">ⓘ</span>
        </div>
        <div class="status-controls">
          <label class="toggle-switch">
            <input type="checkbox" id="dropdownRequiredToggle" />
            <span class="slider"></span>
          </label>
          <span id="dropdownRequiredText" class="status-text"></span>
        </div>
      </div>
      <!-- Add this inside the dropdown-content div, after the required toggle section -->
      <div class="form-setting">
        <div class="status-label">
          <label>Academic Year</label>
          <span class="info-icon" title="The academic year this form applies to (format: YYYY-YYYY)">ⓘ</span>
        </div>
        <div class="status-controls">
          <input type="text" id="dropdownAcademicYear" placeholder="YYYY-YYYY" pattern="[0-9]{4}-[0-9]{4}"
            title="Enter academic year in YYYY-YYYY format" />
        </div>
      </div>
      <div class="dropdown-footer">
        <button id="dropdownSaveBtn" class="save-btn">Save Changes</button>
        <button id="dropdownArchiveBtn" class="delete-btn">Archive</button>
      </div>
    </div>
  </div>

  <script>
    const userName = localStorage.getItem("username") || "Admin";
    let currentFormId = null;
    let currentMenuElement = null;
    let currentFormStatus = null;
    let currentFormRequired = null;

    document.getElementById("user-name").innerText = userName;
    const greetingElements = document.querySelectorAll(".user-name");
    greetingElements.forEach((element) => {
      element.innerText = userName;
    });

    // Status mapping
    const statusMap = {
      1: { text: "Published", class: "published-status" },
      0: { text: "Unpublished", class: "unpublished-status" },
      "-1": { text: "Archived", class: "archived-status" },
    };

    // Required mapping
    const requiredMap = {
      1: { text: "Required", class: "required-status" },
      0: { text: "Optional", class: "optional-status" },
    };

    // Fetch and display forms
    async function loadForms() {
      try {
        const response = await fetch(
          "http://localhost/cgcc/backend/forms/form.php",
          {
            credentials: "include",
          }
        );

        if (!response.ok) throw new Error("Failed to fetch form data");

        const data = await response.json();
        const container = document.getElementById("form-card-container");
        container.innerHTML = "";

        if (!data || !Array.isArray(data) || data.length === 0) {
          container.innerHTML =
            '<div class="no-forms">No forms available at the moment.</div>';
          return;
        }

        data.forEach((form) => {
          // Skip archived forms in the main view
          if (form.is_active === "-1") return;

          const card = document.createElement("div");
          card.classList.add("form-card");

          const statusInfo = statusMap[form.is_active] || statusMap["0"];
          const statusClass = `status-indicator ${statusInfo.class}`;

          // Add required indicator if form is required
          const requiredInfo =
            form.is_required === "1"
              ? '<div class="required-indicator" title="Required for counseling">★</div>'
              : "";

          let description = form.description || "No description";
          const truncatedDescription =
            description.length > 100
              ? description.substring(0, 100) + "..."
              : description;

          card.innerHTML = `
            <div class="form-card-menu" onclick="openSettingsMenu(${form.form_index
            }, '${form.is_active}', '${form.is_required}', event)">⋮</div>
            ${requiredInfo}
            <div class="${statusClass}"></div>
            <h3>${form.form_name}</h3>
            <p class="form-description">${truncatedDescription.replace(
              /\n/g,
              " "
            )}</p>
            <p class="academic-year">Academic Year: ${form.academic_year || "Not set"
            }</p>
            <a href="http://localhost/cgcc/public/admin/formbuilder.html?id=${form.form_index
            }">Open Form</a>
        `;

          container.appendChild(card);
        });
      } catch (error) {
        console.error("Error fetching forms:", error);
        document.getElementById("form-card-container").innerHTML =
          '<div class="no-forms">Failed to load forms. Please try again later.</div>';
      }
    }

    // Dropdown menu functions
    function openSettingsMenu(formId, status, isRequired, event) {
      event.stopPropagation();
      const dropdown = document.getElementById("dropdownMenu");

      // Close if clicking the same menu
      if (
        currentMenuElement === event.target &&
        dropdown.style.display === "block"
      ) {
        closeSettingsMenu();
        return;
      }

      // Close any open menus
      closeSettingsMenu();

      currentFormId = formId;
      currentFormStatus = status;
      currentFormRequired = isRequired;
      currentMenuElement = event.target;

      // Position the dropdown near the clicked button
      const buttonRect = event.target.getBoundingClientRect();

      dropdown.style.display = "block";
      dropdown.style.top = `${buttonRect.bottom + window.scrollY}px`;
      dropdown.style.left = `${buttonRect.right + window.scrollX - 280}px`;

      // Load form data
      loadFormSettings(formId, status, isRequired);
    }

    function closeSettingsMenu() {
      document.getElementById("dropdownMenu").style.display = "none";
      currentMenuElement = null;
      currentFormStatus = null;
      currentFormRequired = null;
    }

    function loadFormSettings(formId, status, isRequired) {
      const statusToggle = document.getElementById("dropdownStatusToggle");
      const statusText = document.getElementById("dropdownStatusText");
      const requiredToggle = document.getElementById(
        "dropdownRequiredToggle"
      );
      const requiredText = document.getElementById("dropdownRequiredText");
      const academicYearInput = document.getElementById(
        "dropdownAcademicYear"
      );
      const archiveBtn = document.getElementById("dropdownArchiveBtn");

      // First fetch the full form data to get academic year
      fetch(
        `http://localhost/cgcc/backend/forms/form.php?form_index=${formId}`,
        {
          credentials: "include",
        }
      )
        .then((response) => response.json())
        .then((form) => {
          // Update status UI
          const statusInfo = statusMap[status] || statusMap["0"];
          statusText.textContent = statusInfo.text;
          statusText.className = `status-text ${statusInfo.class}`;
          statusToggle.checked = status === "1";
          statusToggle.disabled = status === "-1";

          // Update required UI
          const requiredInfo = requiredMap[isRequired] || requiredMap["0"];
          requiredText.textContent = requiredInfo.text;
          requiredText.className = `status-text ${requiredInfo.class}`;
          requiredToggle.checked = isRequired === "1";
          requiredToggle.disabled = status === "-1";

          // Update academic year
          academicYearInput.value = form.academic_year || "";
          academicYearInput.disabled = status === "-1";

          // Update archive button text and visibility
          if (status === "-1") {
            archiveBtn.textContent = "Unarchive";
            archiveBtn.style.backgroundColor = "#4fbd9c";
          } else {
            archiveBtn.textContent = "Archive";
            archiveBtn.style.backgroundColor = "#f44336";
          }
        })
        .catch((error) => {
          console.error("Error fetching form details:", error);
        });
    }

    // Event listeners
    document.addEventListener("DOMContentLoaded", () => {
      // Load forms
      loadForms();

      // Close menu when clicking outside
      document.addEventListener("click", (event) => {
        if (
          !event.target.closest(".dropdown-menu") &&
          !event.target.closest(".form-card-menu")
        ) {
          closeSettingsMenu();
        }
      });

      // Toggle status text when status toggle is clicked
      document
        .getElementById("dropdownStatusToggle")
        .addEventListener("change", function () {
          const isChecked = this.checked;
          const statusText = document.getElementById("dropdownStatusText");
          if (isChecked) {
            statusText.textContent = "Published";
            statusText.className = "status-text published-status";
          } else {
            statusText.textContent = "Unpublished";
            statusText.className = "status-text unpublished-status";
          }
        });

      // Toggle required text when required toggle is clicked
      document
        .getElementById("dropdownRequiredToggle")
        .addEventListener("change", function () {
          const isChecked = this.checked;
          const requiredText = document.getElementById(
            "dropdownRequiredText"
          );
          if (isChecked) {
            requiredText.textContent = "Required";
            requiredText.className = "status-text required-status";
          } else {
            requiredText.textContent = "Optional";
            requiredText.className = "status-text optional-status";
          }
        });

      // Save button handler
      document
        .getElementById("dropdownSaveBtn")
        .addEventListener("click", async function () {
          try {
            const isActive = document.getElementById("dropdownStatusToggle")
              .checked
              ? "1"
              : "0";
            const isRequired = document.getElementById(
              "dropdownRequiredToggle"
            ).checked
              ? "1"
              : "0";
            const academicYear = document.getElementById(
              "dropdownAcademicYear"
            ).value;

            // Validate academic year format
            if (academicYear && !/^[0-9]{4}-[0-9]{4}$/.test(academicYear)) {
              showStatusMessage(
                "Academic year must be in YYYY-YYYY format",
                "error"
              );
              return;
            }

            const response = await fetch(
              "http://localhost/cgcc/backend/forms/form.php",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type": "application/json",
                  "X-Requested-With": "XMLHttpRequest",
                },
                body: JSON.stringify({
                  form_id: currentFormId,
                  is_active: isActive,
                  is_required: isRequired,
                  academic_year: academicYear,
                }),
              }
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(
                result.message || "Failed to update form settings"
              );
            }

            if (result.success) {
              closeSettingsMenu();
              loadForms();
              showStatusMessage(
                `Form settings updated successfully`,
                "success"
              );
            } else {
              throw new Error(result.message || "Update failed");
            }
          } catch (error) {
            console.error("Error:", error);
            showStatusMessage(
              "Failed to save settings: " + error.message,
              "error"
            );
          }
        });

      // Archive button handler
      document
        .getElementById("dropdownArchiveBtn")
        .addEventListener("click", async function () {
          const action = currentFormStatus === "-1" ? "unarchive" : "archive";
          const confirmAction = confirm(
            `Are you sure you want to ${action} this form?`
          );

          if (!confirmAction) return;

          try {
            const newStatus = currentFormStatus === "-1" ? "0" : "-1";

            const response = await fetch(
              "http://localhost/cgcc/backend/forms/form.php",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type": "application/json",
                  "X-Requested-With": "XMLHttpRequest",
                },
                body: JSON.stringify({
                  form_id: currentFormId,
                  is_active: newStatus,
                  is_required: currentFormRequired, // Keep the same required status
                }),
              }
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(
                result.message || "Failed to update form status"
              );
            }

            if (result.success) {
              closeSettingsMenu();
              loadForms();
              showStatusMessage(
                `Form ${newStatus === "-1" ? "archived" : "unarchived"
                } successfully`,
                "success"
              );
            } else {
              throw new Error(result.message || "Update failed");
            }
          } catch (error) {
            console.error("Error:", error);
            showStatusMessage(
              "Failed to archive form: " + error.message,
              "error"
            );
          }
        });

      // Helper function to show status messages
      function showStatusMessage(message, type) {
        const statusElement = document.createElement("div");
        statusElement.className = `autosave-status show ${type}`;
        statusElement.textContent = message;
        document.body.appendChild(statusElement);

        setTimeout(() => {
          statusElement.remove();
        }, 3000);
      }
    });
  </script>
</body>

</html>
