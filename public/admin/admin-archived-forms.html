<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../Media/cgcc2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/manage-forms.css" />
  <link rel="stylesheet" href="../css/alert.css" />
  <title>CGCC - Archived Forms</title>
  <style>
    .status-message {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        border-radius: 4px;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 9999;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        min-width: 300px;
        transform: translateX(120%);
        transition: transform 0.3s ease-in-out;
        border-left: 4px solid #316b50;
    }

    .status-message.show {
        transform: translateX(0);
    }

    .status-message.success {
        border-left-color: #316b50;
    }

    .status-message.error {
        border-left-color: #dc3545;
    }

    .status-message.warning {
        border-left-color: #ffc107;
    }

    .form-card .academic-year {
        margin: 2px 0;
        font-size: 0.9em;
    }

    .form-card .academic-year-label {
        font-weight: bold;
    }

    .form-card a {
        margin-top: 15px;
        display: inline-block;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="../Media/cgcc.png" alt="cgcc-logo" class="logo-img" />
      College Guidance and Counseling Center
    </div>
  </header>

  <div class="grid-body">
    <div class="left-bg"></div>
    <div class="page-left">
      <div class="profile">
        <div class="profile-picture"></div>
        <span id="user-name"></span>
      </div>
      <div class="sidebar-nav">
        <a href="admin-manage-forms.html" class="nav-link">Manage Forms</a>
        <a href="admin-manage-counselor.html" class="nav-link">Manage Counselors</a>
        <a href="admin-manage-program.html" class="nav-link">Manage Programs</a>
        <a href="admin-archived-forms.html" class="nav-link active">Archived Forms</a>
      </div>

      <div class="logout-wrapper">
        <form method="POST" action="../../backend/logout.php">
          <button type="submit" class="logout-btn">Log Out</button>
        </form>
      </div>
    </div>

    <div class="page-right">
      <div class="header-section">
        <h1>Archived Forms</h1>
        <p>View and manage archived counseling forms</p>
      </div>

      <h2 class="section-title">Archived Forms</h2>
      <div class="form-cards-section">
        <div id="archived-form-card-container" class="cards-grid">
          <!-- Archived cards will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Dropdown Menu -->
  <div id="dropdownMenu" class="dropdown-menu">
    <div class="dropdown-content">
      <div class="form-setting">
        <div class="status-label">
          <label>Form Status</label>
          <span class="info-icon" title="This form is currently archived">ⓘ</span>
        </div>
        <div class="status-controls">
          <span id="dropdownStatusText" class="status-text archived-status">Archived</span>
        </div>
      </div>
      <div class="dropdown-footer">
        <button id="dropdownUnarchiveBtn" class="save-btn">Unarchive</button>
      </div>
    </div>
  </div>

  <script>
    const userName = localStorage.getItem("username") || "Admin";
    let currentFormId = null;
    let currentMenuElement = null;

    document.getElementById("user-name").innerText = userName;

    // Status mapping
    const statusMap = {
      '1': { text: 'Published', class: 'published-status' },
      '0': { text: 'Unpublished', class: 'unpublished-status' },
      '-1': { text: 'Archived', class: 'archived-status' }
    };

    // Function to show styled confirm dialog
    function styledConfirm(message) {
        return new Promise((resolve) => {
            // Remove any existing alerts
            const existingAlert = document.querySelector('.alert');
            if (existingAlert) {
                existingAlert.remove();
            }

            // Create alert elements
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-warning';
            alertDiv.style.zIndex = '9999';

            const alertContent = document.createElement('div');
            alertContent.className = 'alert-content';

            const alertTitle = document.createElement('div');
            alertTitle.className = 'alert-title';
            alertTitle.textContent = 'Confirm Action';
            alertTitle.style.color = '#ffc107';

            const alertMessage = document.createElement('div');
            alertMessage.className = 'alert-message';
            alertMessage.textContent = message;

            const buttonContainer = document.createElement('div');
            buttonContainer.style.display = 'flex';
            buttonContainer.style.gap = '10px';
            buttonContainer.style.justifyContent = 'center';

            const cancelButton = document.createElement('button');
            cancelButton.className = 'alert-button';
            cancelButton.textContent = 'Cancel';
            cancelButton.style.backgroundColor = '#6c757d';
            cancelButton.style.color = '#fff';
            cancelButton.onclick = () => {
                alertDiv.classList.add('fade-out');
                setTimeout(() => alertDiv.remove(), 300);
                resolve(false);
            };

            const confirmButton = document.createElement('button');
            confirmButton.className = 'alert-button';
            confirmButton.textContent = 'Confirm';
            confirmButton.style.backgroundColor = '#ffc107';
            confirmButton.style.color = '#000';
            confirmButton.onclick = () => {
                alertDiv.classList.add('fade-out');
                setTimeout(() => alertDiv.remove(), 300);
                resolve(true);
            };

            // Assemble the alert
            buttonContainer.appendChild(cancelButton);
            buttonContainer.appendChild(confirmButton);
            alertContent.appendChild(alertTitle);
            alertContent.appendChild(alertMessage);
            alertContent.appendChild(buttonContainer);
            alertDiv.appendChild(alertContent);

            // Add to document
            document.body.appendChild(alertDiv);

            // Add fade-in animation
            setTimeout(() => alertDiv.style.opacity = '1', 10);
        });
    }

    // Fetch and display archived forms
    async function loadArchivedForms() {
      try {
        const response = await fetch(
          "http://localhost/cgcc/backend/forms/form.php",
          {
            credentials: "include",
          }
        );

        if (!response.ok) throw new Error("Failed to fetch form data");

        const data = await response.json();
        const container = document.getElementById("archived-form-card-container");
        container.innerHTML = "";

        if (!data || !Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<div class="no-forms">No archived forms available.</div>';
          return;
        }

        // Filter and show only archived forms
        const archivedForms = data.filter(form => form.is_active === '-1');
        
        if (archivedForms.length === 0) {
          container.innerHTML = '<div class="no-forms">No archived forms available.</div>';
          return;
        }

        archivedForms.forEach((form) => {
          const card = document.createElement("div");
          card.classList.add("form-card");

          const statusInfo = statusMap[form.is_active] || statusMap['-1'];
          const statusClass = `status-indicator ${statusInfo.class}`;

          let description = form.description || "No description";
          const truncatedDescription =
            description.length > 100
              ? description.substring(0, 100) + "..."
              : description;

          card.innerHTML = `
            <div class="form-card-menu" onclick="openSettingsMenu(${form.form_index}, event)">⋮</div>
            <div class="${statusClass}"></div>
            <h3>${form.form_name}</h3>
            <p class="form-description">${truncatedDescription.replace(/\n/g, " ")}</p>
            <p class="academic-year"><span class="academic-year-label">Created:</span> ${form.created_at ? form.created_at.split(' ')[0] : "Not available"}</p>
            <p class="academic-year"><span class="academic-year-label">Last Updated:</span> ${form.updated_at ? form.updated_at.split(' ')[0] : "Not available"}</p>
            <p class="academic-year"><span class="academic-year-label">Archived At:</span> ${form.archived_at ? form.archived_at.split(' ')[0] : "Not available"}</p>
            <a href="http://localhost/cgcc/public/admin/formbuilder.html?id=${form.form_index}">View Form</a>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        console.error("Error fetching forms:", error);
        document.getElementById("archived-form-card-container").innerHTML =
          '<div class="no-forms">Failed to load archived forms. Please try again later.</div>';
      }
    }

    // Dropdown menu functions
    function openSettingsMenu(formId, event) {
      event.stopPropagation();
      const dropdown = document.getElementById("dropdownMenu");
      
      // Close if clicking the same menu
      if (currentMenuElement === event.target && dropdown.style.display === "block") {
        closeSettingsMenu();
        return;
      }

      // Close any open menus
      closeSettingsMenu();
      
      currentFormId = formId;
      currentMenuElement = event.target;
      
      // Position the dropdown near the clicked button
      const buttonRect = event.target.getBoundingClientRect();
      
      dropdown.style.display = "block";
      dropdown.style.top = `${buttonRect.bottom + window.scrollY}px`;
      dropdown.style.left = `${buttonRect.right + window.scrollX - 280}px`;
    }

    function closeSettingsMenu() {
      document.getElementById("dropdownMenu").style.display = "none";
      currentMenuElement = null;
    }

    // Event listeners
    document.addEventListener("DOMContentLoaded", () => {
      // Load archived forms
      loadArchivedForms();
      
      // Close menu when clicking outside
      document.addEventListener("click", (event) => {
        if (!event.target.closest('.dropdown-menu') && !event.target.closest('.form-card-menu')) {
          closeSettingsMenu();
        }
      });

      // Unarchive button handler
      document.getElementById("dropdownUnarchiveBtn").addEventListener("click", async function() {
        const confirmAction = await styledConfirm("Are you sure you want to unarchive this form?");
        
        if (!confirmAction) return;
        
        try {
          const response = await fetch(
            "http://localhost/cgcc/backend/forms/form.php",
            {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                form_id: currentFormId,
                is_active: '0' // Unarchive but keep as unpublished
              }),
            }
          );

          if (!response.ok) throw new Error("Failed to update form status");
          
          const result = await response.json();
          if (result.success) {
            closeSettingsMenu();
            loadArchivedForms();
            showAlert('Success', 'Form unarchived successfully', 'success');
          } else {
            throw new Error(result.message || "Update failed");
          }
        } catch (error) {
          console.error("Error:", error);
          showAlert('Error', 'Failed to unarchive form: ' + error.message, 'danger');
        }
      });
    });

    // Function to show styled alert
    function showAlert(title, message, type = 'warning') {
        // Remove any existing alerts
        const existingAlert = document.querySelector('.alert');
        if (existingAlert) {
            existingAlert.remove();
        }

        // Create alert elements
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.zIndex = '9999';

        const alertContent = document.createElement('div');
        alertContent.className = 'alert-content';

        const alertTitle = document.createElement('div');
        alertTitle.className = 'alert-title';
        alertTitle.textContent = title;
        alertTitle.style.color = type === 'success' ? '#316b50' : 
                               type === 'danger' ? '#dc3545' : 
                               type === 'warning' ? '#ffc107' : '#316b50';

        const alertMessage = document.createElement('div');
        alertMessage.className = 'alert-message';
        alertMessage.textContent = message;

        const alertButton = document.createElement('button');
        alertButton.className = 'alert-button';
        alertButton.textContent = 'OK';
        alertButton.style.backgroundColor = type === 'success' ? '#316b50' : 
                                          type === 'danger' ? '#dc3545' : 
                                          type === 'warning' ? '#ffc107' : '#316b50';
        alertButton.style.color = type === 'warning' ? '#000' : '#fff';
        alertButton.onclick = () => {
            alertDiv.classList.add('fade-out');
            setTimeout(() => alertDiv.remove(), 300);
        };

        // Assemble the alert
        alertContent.appendChild(alertTitle);
        alertContent.appendChild(alertMessage);
        alertContent.appendChild(alertButton);
        alertDiv.appendChild(alertContent);

        // Add to document
        document.body.appendChild(alertDiv);

        // Add fade-in animation
        setTimeout(() => alertDiv.style.opacity = '1', 10);
    }
  </script>
</body>
</html>
