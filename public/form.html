<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #dee2e6;
        }
        .question-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        .required-label::after {
            content: " *";
            color: red;
        }
        .grid-table {
            width: 100%;
        }
        .grid-table th {
            text-align: center;
            background-color: #f1f1f1;
        }
        .grid-table td {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div id="form-container">
            <div class="text-center mb-4">
                <h1 id="form-title">Loading form...</h1>
                <p id="form-description" class="lead"></p>
            </div>
            <div id="sections-container"></div>
            <div class="d-grid gap-2">
                <button id="submit-btn" class="btn btn-primary btn-lg" disabled>Submit Form</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const formId = urlParams.get('id');
            
            if (!formId) {
                alert('No form ID specified in URL');
                return;
            }

            fetchFormData(formId);
        });

        async function fetchFormData(formId) {
            try {
                const response = await fetch(`http://localhost/cgcc-system/backend/forms/getformforsubmission.php?id=${formId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch form data');
                }
                
                const formData = await response.json();
                renderForm(formData);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('form-title').textContent = 'Error loading form';
                alert('Failed to load form. Please try again later.');
            }
        }

        function renderForm(formData) {
            // Set form title and description
            document.getElementById('form-title').textContent = formData.title;
            document.getElementById('form-description').textContent = formData.description;
            
            const sectionsContainer = document.getElementById('sections-container');
            sectionsContainer.innerHTML = '';
            
            // Render each section
            formData.sections.forEach(section => {
                const sectionElement = document.createElement('div');
                sectionElement.className = 'form-section';
                
                if (section.title) {
                    const sectionTitle = document.createElement('h2');
                    sectionTitle.textContent = section.title;
                    sectionElement.appendChild(sectionTitle);
                }
                
                if (section.description) {
                    const sectionDesc = document.createElement('p');
                    sectionDesc.className = 'text-muted';
                    sectionDesc.textContent = section.description;
                    sectionElement.appendChild(sectionDesc);
                }
                
                // Render questions in this section
                section.questions.forEach(question => {
                    const questionCard = document.createElement('div');
                    questionCard.className = 'question-card';
                    
                    const questionLabel = document.createElement('label');
                    questionLabel.className = 'form-label mb-3';
                    if (question.required) {
                        questionLabel.classList.add('required-label');
                    }
                    questionLabel.textContent = question.question;
                    questionCard.appendChild(questionLabel);
                    
                    // Render appropriate input based on question type
                    switch (question.type) {
                        case 'short':
                            questionCard.appendChild(createShortAnswerInput(question));
                            break;
                        case 'paragraph':
                            questionCard.appendChild(createParagraphInput(question));
                            break;
                        case 'multiple':
                            questionCard.appendChild(createMultipleChoiceInput(question));
                            break;
                        case 'checkbox':
                            questionCard.appendChild(createCheckboxInput(question));
                            break;
                        case 'dropdown':
                            questionCard.appendChild(createDropdownInput(question));
                            break;
                        case 'grid':
                            questionCard.appendChild(createGridInput(question));
                            break;
                        case 'date':
                            questionCard.appendChild(createDateInput(question));
                            break;
                        default:
                            questionCard.appendChild(document.createTextNode('Unsupported question type'));
                    }
                    
                    sectionElement.appendChild(questionCard);
                });
                
                sectionsContainer.appendChild(sectionElement);
            });
            
            // Enable submit button
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').addEventListener('click', () => {
                submitForm(formData.form_id);
            });
        }

        function createShortAnswerInput(question) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control';
            input.dataset.questionId = question.id;
            input.dataset.questionType = question.type;
            input.required = question.required;
            return input;
        }

        function createParagraphInput(question) {
            const textarea = document.createElement('textarea');
            textarea.className = 'form-control';
            textarea.rows = 4;
            textarea.dataset.questionId = question.id;
            textarea.dataset.questionType = question.type;
            textarea.required = question.required;
            return textarea;
        }

        function createMultipleChoiceInput(question) {
            const container = document.createElement('div');
            
            question.options.forEach(option => {
                const div = document.createElement('div');
                div.className = 'form-check';
                
                const input = document.createElement('input');
                input.className = 'form-check-input';
                input.type = 'radio';
                input.name = `question_${question.id}`;
                input.value = option.id;
                input.dataset.questionId = question.id;
                input.dataset.questionType = question.type;
                input.required = question.required;
                
                const label = document.createElement('label');
                label.className = 'form-check-label';
                label.htmlFor = `option_${option.id}`;
                label.textContent = option.text;
                
                div.appendChild(input);
                div.appendChild(label);
                container.appendChild(div);
            });
            
            return container;
        }

        function createCheckboxInput(question) {
            const container = document.createElement('div');
            
            question.options.forEach(option => {
                const div = document.createElement('div');
                div.className = 'form-check';
                
                const input = document.createElement('input');
                input.className = 'form-check-input';
                input.type = 'checkbox';
                input.name = `question_${question.id}`;
                input.value = option.id;
                input.dataset.questionId = question.id;
                input.dataset.questionType = question.type;
                
                const label = document.createElement('label');
                label.className = 'form-check-label';
                label.htmlFor = `option_${option.id}`;
                label.textContent = option.text;
                
                div.appendChild(input);
                div.appendChild(label);
                container.appendChild(div);
            });
            
            return container;
        }

        function createDropdownInput(question) {
            const select = document.createElement('select');
            select.className = 'form-select';
            select.dataset.questionId = question.id;
            select.dataset.questionType = question.type;
            select.required = question.required;
            
            // Add default empty option
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- Select an option --';
            defaultOption.selected = true;
            defaultOption.disabled = true;
            select.appendChild(defaultOption);
            
            // Add options
            question.options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option.id;
                opt.textContent = option.text;
                select.appendChild(opt);
            });
            
            return select;
        }

        function createGridInput(question) {
            const table = document.createElement('table');
            table.className = 'grid-table table table-bordered';
            
            // Create header row with options
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            // Empty first header cell
            headerRow.appendChild(document.createElement('th'));
            
            // Add option headers
            question.options.forEach(option => {
                const th = document.createElement('th');
                th.textContent = option.text;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Create table body with rows
            const tbody = document.createElement('tbody');
            
            question.rows.forEach(row => {
                const tr = document.createElement('tr');
                
                // Row label cell
                const labelCell = document.createElement('td');
                labelCell.textContent = row.text;
                tr.appendChild(labelCell);
                
                // Radio button cells
                question.options.forEach(option => {
                    const cell = document.createElement('td');
                    cell.className = 'text-center';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question_${question.id}_row_${row.id}`;
                    input.value = option.id;
                    input.dataset.questionId = question.id;
                    input.dataset.rowId = row.id;
                    input.dataset.questionType = question.type;
                    if (question.required) {
                        input.dataset.required = 'true';
                    }
                    
                    cell.appendChild(input);
                    tr.appendChild(cell);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            return table;
        }

        function createDateInput(question) {
            const input = document.createElement('input');
            input.type = 'date';
            input.className = 'form-control';
            input.dataset.questionId = question.id;
            input.dataset.questionType = question.type;
            input.required = question.required;
            return input;
        }

        async function submitForm(formId) {
            // Validate required fields first
            if (!validateRequiredFields()) {
                alert('Please complete all required fields');
                return;
            }
            
            // Collect all responses
            const responses = collectResponses();
            
            try {
                const response = await fetch('http://localhost/cgcc-system/backend/forms/submit_response.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        form_id: formId,
                        responses: responses
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to submit form');
                }
                
                const result = await response.json();
                alert('Form submitted successfully!');
                // Optionally redirect or show success message
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to submit form. Please try again.');
            }
        }

        function validateRequiredFields() {
            let isValid = true;
            
            document.querySelectorAll('[data-question-id]').forEach(element => {
                const questionId = element.dataset.questionId;
                const questionType = element.dataset.questionType;
                const isRequired = element.required || element.dataset.required === 'true';
                
                if (!isRequired) return;
                
                if (questionType === 'grid') {
                    // For grid questions, check at least one radio is selected per row
                    const rowId = element.dataset.rowId;
                    const radioGroup = document.querySelectorAll(
                        `input[type="radio"][name="question_${questionId}_row_${rowId}"]`
                    );
                    
                    const isChecked = Array.from(radioGroup).some(radio => radio.checked);
                    if (!isChecked) {
                        isValid = false;
                        // Highlight the row
                        const row = element.closest('tr');
                        row.style.backgroundColor = 'rgba(255, 0, 0, 0.1)';
                    }
                } else if (questionType === 'checkbox') {
                    // For checkboxes, at least one needs to be checked
                    const checkboxes = document.querySelectorAll(
                        `input[type="checkbox"][data-question-id="${questionId}"]`
                    );
                    const isChecked = Array.from(checkboxes).some(cb => cb.checked);
                    if (!isChecked) {
                        isValid = false;
                        highlightRequired(element);
                    }
                } else if (questionType === 'multiple' || questionType === 'dropdown') {
                    // For radio groups and dropdowns
                    if (!element.checked && !element.value) {
                        isValid = false;
                        highlightRequired(element);
                    }
                } else {
                    // For text inputs, textareas, etc.
                    if (!element.value.trim()) {
                        isValid = false;
                        highlightRequired(element);
                    }
                }
            });
            
            return isValid;
        }

        function highlightRequired(element) {
            element.style.borderColor = 'red';
            setTimeout(() => {
                element.style.borderColor = '';
            }, 2000);
        }

        function collectResponses() {
            const responses = [];
            
            // Handle regular questions (non-grid)
            document.querySelectorAll('[data-question-id]:not([data-row-id])').forEach(element => {
                const questionId = element.dataset.questionId;
                const questionType = element.dataset.questionType;
                
                if (questionType === 'checkbox') {
                    // Checkboxes can have multiple selections
                    const checkedBoxes = document.querySelectorAll(
                        `input[type="checkbox"][data-question-id="${questionId}"]:checked`
                    );
                    
                    if (checkedBoxes.length > 0) {
                        Array.from(checkedBoxes).forEach(checkbox => {
                            responses.push({
                                question_id: questionId,
                                type: questionType,
                                choice_id: checkbox.value,
                                text_answer: null
                            });
                        });
                    }
                } else if (questionType === 'multiple' || questionType === 'dropdown') {
                    // Radio buttons and dropdowns
                    if (element.checked || (element.tagName === 'SELECT' && element.value)) {
                        responses.push({
                            question_id: questionId,
                            type: questionType,
                            choice_id: element.value,
                            text_answer: null
                        });
                    }
                } else {
                    // Text inputs, textareas, date inputs
                    if (element.value.trim()) {
                        responses.push({
                            question_id: questionId,
                            type: questionType,
                            choice_id: null,
                            text_answer: element.value.trim()
                        });
                    }
                }
            });
            
            // Handle grid questions
            document.querySelectorAll('[data-question-type="grid"][data-row-id]').forEach(element => {
                if (element.checked) {
                    responses.push({
                        question_id: element.dataset.questionId,
                        type: 'grid',
                        row_id: element.dataset.rowId,
                        choice_id: element.value,
                        text_answer: null
                    });
                }
            });
            
            return responses;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
